- page: 7
  source: "第 44 题第 (3) 问末行 + 第 (4) 问 + 第 45 题全部（**含资源分配图**）+ 第 46 题第 (1) 问（**含模式位图、用户／内核空间图两张图**）。`page_bands.py` 量得 **23 条墨迹带**：#0 页眉；#1 = 页首续行 `令 6 为无条件转移指令…不需要用到 FR。`（y54）；#2—#6 = 第 (4) 问五行（y70—140）；#7 = `45.【解析】`（y148）；#8 = `（1）该时刻资源分配图如下：`（y163）；**#9（y183—297，高 114pt，x196—324）= 资源分配图**；#10 = `上述资源分配图无法化简，所以系统处于死锁状态。`（y308）；#11—#14 = 第 (2) 问四行（y324—379）；#15 = `采用银行家算法防止系统进入不安全状态可以避免死锁。`（y386）；#16 = `46.【解析】`（y401）；#17 = `（1）键盘作为字符设备…通常采用中断 I/O 方式。`（y417）；#18 = `程序在调用系统调用时，CPU 处于用户态，如下图所示。`（y432）；**#19（y450—533，高 83pt，x112—409）= 模式位图**；**#20（y542—649，高 107pt，x83—438）= 用户／内核空间图**；#21 = `I/O 指令属于特权指令。`（y660）；#22 = 页脚。**第 (4) 问的一个排版判定**：`PCout`／`MARin`／`MDRout`／`GPRout`／`Yin`／`IRin`／`GPRin`／`SRout` 里的 in/out 是**同基线的小号斜体**、**不是下标**——实测 `PC` 墨高 7.0pt、`out` 墨高 4.88pt、两者**底边同为 y78.12**，故写成 `PCout` 而不是 `PC_{out}`。**底本用字照抄不改**：第 (2) 问 `②不剥夺：只能进程主动释放已占有资源`——「只能」后缺一个「由」（应为「只能由进程」），不改，已记入 meta 待复核；同段把死锁四个必要条件写成「互斥条件／不剥夺／请求并保存／循环等待」（「请求并保存」是底本写法，不改）。**三张答案侧插图**（本仓库继 set-3 第 41 题之后的第 2—4 张答案侧插图）：① 资源分配图裁 `x191—330 / y178—303`（墨迹带 #9 四周各留 5pt；上一行是 #8 = y163—171，下一行是 #10 = y308—316，都不相碰），4 倍存为 `assets/q45-ans-fig.png`（556×500）；② 模式位图裁 `x107—415 / y445—539`（带 #19 四周留 5—6pt），4 倍存为 `assets/q46-ans-fig1.png`（1232×376）；③ 用户／内核空间图裁 `x78—444 / y537—654`（带 #20 四周留 5pt，与上一带的间隙只有 8pt，故上边只留 4pt），4 倍存为 `assets/q46-ans-fig2.png`（1464×468）。三张的裁切脚本是 `build/_scratch/probe/crop_ans_figs.py`（渲染口径与 `tools/crop_figures.py` 一致：4 倍、`alpha=False`、RGB）。**逐张直读验收（读出的图内要素即本条对图的证据，图内文字不抄进正文）**：① 资源分配图——P1 在顶、P2 左下、P3 右下；R1 一个方框内**一个圆点**、R2 两圆点、R3 两圆点、R4 一圆点；边为 P1→R1、R2→P1、R1→P2、R3→P2、P3→R3、P3→R2 与 R2→P3（同一对之间的上下两条反向箭头）、P2→R4、R4→P3；**读法自洽校验**：图上存在环路 P1→R1→P2→R4→P3→R2→P1，正是正文「无法化简，所以系统处于死锁状态」的那个环；② 模式位图——上方一框标「用户程序」，内含三个小框「用户程序执行」「调用系统调用」「从系统调用返回」，右侧标「用户态（模式位=1）」；下方一框标「内核」，内含「执行系统调用」，两条箭头分别标「陷入 模式位=0」「返回 模式位=1」，右侧标「内核态（模式位=0）」；**自洽校验**：正文说「程序在调用系统调用时，CPU 处于用户态」，图上「调用系统调用」恰在用户态框内、只有跨框进入「执行系统调用」时模式位才变 0；③ 用户／内核空间图——两个虚线大框，左标「用户空间、运行在用户态」、右标「内核空间、运行在内核态」；左框三个实线框 `main(){…printf();…}`、`printf(){…xxxx();…}`、`write(){…int $0x80;…}`，下方标签「用户程序」「printf() 标准库函数」「write() 封装函数」；右框两个实线框 `system_call(){…xxxx();…}`、`sys_write(){…}`，下方标签「系统调用处理程序」「系统调用服务例程」；调用箭头实／虚线交替向右、返回箭头向左；**自洽校验**：`write()` 框里那行 `int $0x80;` 就是陷入内核的那条指令，正对右框「系统调用处理程序」，与下一行答案「I/O 指令属于特权指令」（用户态执行不了 `int $0x80` 之后的特权操作）对得上。**OCR 误识已按页图改回**：`(4）`/`(1）`/`(2）` 全角化、`①`—`⑥`（草稿把最后一项读成 `SRout=1` 而丢了序号）、`⑤GPRout`（草稿 `③GPRout`，与第 3 项重号）、`PCout=1、MARin=1`（草稿空格不匀）、`中断 I/O 方式`（草稿 `中断IVO方式`）、`用户态，如下图所示`、`I/O 指令属于特权指令`（草稿 `I/O指令`），插图区域草稿留下的散字 `R1`/`O`/`o0`/`R2`/`R3`/`00`/`R4`/`O`（资源分配图）、`用户程序`/`用户态`/`用户程序执行`/…/`（模式位=0）`（模式位图）、`mainO`/`printfO`/`writeO{`/`ystem_call(`/`xXxx;`/`XXXx)`（用户／内核空间图）**一律不采用**，以三张裁图为准。"
- page: 8
  source: "第 46 题第 (2)(3) 问 + 第 47 题全部（**含路由表**，本页即卷末）。`page_bands.py` 量得 **24 条墨迹带**：#0 页眉；#1—#2 = 第 46 题第 (2) 问两行（y54—78）；#3—#5 = 第 (3) 问三行（y85—125）；#6 = `47.【解析】`（y132）；#7—#10 = 第 (1) 问四行（y148—203）；#11—#12 = `（2）…路由表格式如下所示。` 两行（y210—233）；**表：上线 y242—243、表头 y248—261、数据行 y267—342、下线 y347—348**（`page_bands.py` 另量得 6 条横线 y242.5／260.1／277.9／295.2／313.0／330.3／347.9，即**表头 1 行 + 数据 5 行**；三列分界在 x≈140／236.9／316.3，表右缘 x369）；#20—#22 = 第 (3) 问三行（y356—395）；#23 = 页脚。**直读图**：表格 6 倍 `build/_scratch/probe/s4sol8tab.png`，短横列另用 `s4sol8dashzoom.png` 逐格核。**路由表按 GFM 转录**（表头取底本表头行 `目的网络／下一跳／接口`，5 行数据照抄，行序不动）：本地三个网段 `130.120.10.0/26`→E1、`130.120.10.64/26`→E2、`130.120.10.128/25`→E3 的「下一跳」是**短线**（实测 w=4.75pt、厚 0.4—0.75pt，是一条横线：既不是汉字「一」，也不是破折号；本卷口径「短横一律 ASCII `-`」，写成 `-`）；`202.100.10.160/29`→`130.110.12.1`→L1；默认路由 `0.0.0.0/0`→`130.110.10.1`→L0。**读法自洽校验两条**：其一，下一跳 `130.110.12.1` 与题目卷第 10 页拓扑图上 R2 挂 R1 那一侧 `L0 130.110.12.1` 逐字相同、`130.110.10.1` 与 R3 挂 R1 那一侧 `L1 130.110.10.1` 逐字相同——若把下一跳读串，这两个 IP 就对不上图；其二，第 (1) 问划出的三个子网 `130.120.10.0/26`／`.64/26`／`.128/25` 与前三条路由的目的网络逐字相同，路由表正是这三段的直连项。**底本用字照抄不改**：第 (1) 问 `部门 1 的员工等于部门 2 的员工数量`——主语与宾语不对称（「部门 1 的员工」对「部门 2 的员工数量」），照原印记录，不改，已记入 meta 待复核。**OCR 误识已按页图改回**：`(2）`/`(3）`/`（1）` 全角化、`I/O`（草稿 `IVO`）、`字（节）数`、`L0`（草稿 `LO`，字母 O 与小写 l 之误，图上接口名是大写 L 加数字 0，与同表 `L1` 同款）、路由表整块重排（草稿把 6 行 3 列读成 16 行按列散开的单格，且短横读成「一」）、`达到局域网 1`（底本两处都写「达到」，不是「到达」——照抄，不改）。"
