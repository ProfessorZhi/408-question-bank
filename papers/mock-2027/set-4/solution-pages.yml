# 逐页人工转录的来源登记（mock-2027/set-4 答案卷／解析卷）
#
# 底本 `sources/mock-2027/pdf/mock2027-set4-solution.pdf` 是**扫描件**（8 页，515.88×728.52，
# sha256 252050ebef47855daebb9f943c86c2337e079b5f1c44415d463e7d9defb61944），**无文字层**，
# 初稿来自 RapidOCR（`build/_scratch/408-raw-pages/sources/mock-2027/pdf/mock2027-set4-solution/`）。
#
# 本卷第 5—8 页（选择题 37—40 的解析流 + 综合题 41—47 的**全部**解答）改为**人工逐页直读页图**，
# 落在同目录 `solution-pages/page-NNN.txt`，由 `tools/md_solutions.py::load_solution_overrides`
# 取用。理由与 set-2/set-3 同一条：这一卷的要害全在**版式敏感**的地方——
#   · 第 41、42 题两段 C 代码（第 5 页 5 行、第 6 页 26 行）——OCR 把缩进整块吃掉，还读出
#     `1/深度优先搜索`（应为 `//`）、`inti=0`、`visit[MAx_SIZE]`、`elseif` 这类**貌似确定**的错字；
#   · 第 47 题的路由表——OCR 把 6 行 3 列读成 16 行按列散开的单格，`下一跳` 列里的短横被读成「一」；
#   · 第 43 题 `2^{5}=32`、`2^{6}-40-1=23`、第 42 题 `O(n^{2})` 的上标——OCR 一律压平成 `25`、`26`、`n²`；
#   · 答案卷的**三张插图**（第 45 题资源分配图、第 46 题模式位图与用户／内核空间图，全在第 7 页）——
#     OCR 只留下散落的 `R1`/`O`/`oo`/`执行系统调用` 之类碎片。
#
# 第 1—4 页仍是 OCR 草稿：那里是卷首**答案表**（第 1 页 y146—205 的四行表格）与选择题 1—36 的
# 解析流。答案表的字母**不由 OCR 决定**——它走 `tools/answer_grid_visual.py` 的**人工直读**那一路
# （本卷 2026-10-18 登记：裁带 x38—476 / y138—212 @ 4.0×，落盘
# `build/_scratch/answer-visual/mock2027-set4-solution.json`，读数
# `BAADCCACBA / BDBAAABCDA / BCBCCDBDDA / BDBCDCACAD`），与第 5 页解析流那一路逐位一致。
# `md_solutions.py` 只从第 1—4 页取答案字母，解析正文不进 `solutions.md`。
#
# 全卷统一口径（**沿用 set-3 答案卷那一套**，凡属取舍逐条记在这里）：
#   · **句末标点写作「。」**（底本印的是小实心点，属归一化非临摹）。
#   · **子问题序号全角 `（1）`**（判据见题目卷 `pages.yml` 文首「子问题标记形态」一节）。
#   · **运算符两侧的数学间距写紧凑**：底本在 `=`／`<`／`>`／`+`／`-`／`×`／`→` 两侧加了排版用的
#     数学间距，转录一律写紧凑（`cwnd=2`、`1+2+4+5+6+7+4=29KB`、`30-29=1KB`、`2^{5}=32`、
#     `(PC)+4`、`PCout=1`、`关键字<左孩子结点的关键字`）——这是全套语料的**归一化**，不是墨迹判定；
#     **例外是代码块**：围栏内的字符（含注释里的 `isEnd == True时`）逐字照抄，不做任何归一化。
#   · **汉字与拉丁字母／数字之间保留一个空格**（`结点 10`、`isEnd==true 时`、`高 15 位` 同一口径）。
#   · **上标用 `^{}`**（`2^{5}`、`2^{6}`、`O(n^{2})`），与题目卷同一套写法；底本是上标字形，不是 `^`。
#   · **散文括号全角、公式括号半角**（`（灰色结点）`、`（重复 ACK，快重传阶段）` 对 `min{cwnd, rwnd}`、
#     `(PC)+4`、`（R2）<<2→R1`——最后一处底本就是全角括号包着寄存器名，照抄）。
#   · **短横一律 ASCII `-`**；路由表「下一跳」列里那条直接相连的横线也写 `-`
#     （第 8 页实测墨迹 w=4.75pt、厚 0.4—0.75pt，是一条线、不是汉字「一」，也不是破折号）。
#   · **代码缩进**：版面量得级差 **16.2pt**（第 6 页四级左缘 93.5／109.8／125.8／141.8pt，
#     等宽字宽约 5.4pt，即版面约 3 个空格），转录按**每级 4 空格**重排（与 set-2/set-3 同口径）——
#     只改缩进宽度，层级与字符不动；行末注释的列对齐用空格按版面近似，不作为字符级证据。
#   · **表一律 GFM**：表头取底本表头行；空单元格留空、不猜。
#   · **图用本地相对链接**：本卷答案侧有 3 张图，裁到 `assets/q45-ans-fig.png`、`q46-ans-fig1.png`、
#     `q46-ans-fig2.png`（坐标与验收记在第 7 页条目里），正文以 `![…](assets/…)` 引用。
#     set-3 只有第 41 题一张答案侧插图；set-1/set-2 的答案卷无图，**不回填**。
#   · **页眉 `27考研408模拟卷4·解析` 与页脚 `27考研408模拟卷4·解析·N` 属版式，不转录。**
