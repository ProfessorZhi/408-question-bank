  source: "4 倍两半 `build/_scratch/probe/s4p4top.png`（上半）/ `s4p4bot.png`（下半）直读第 14—23 题（本页只印到第 23 题题干，选项在第 5 页）。墨迹带 41 条（`build/_scratch/probe/s4p4_bands.txt`）：#1 页眉、#2—#3 第 14 题题干两行、#4—#7 第 14 题 A—D、#8—#9 第 15 题题干两行、#10 第 15 题选项、#11 第 16 题题干、#12 第 16 题选项、#13—#14 第 17 题题干两行、#15 第 17 题选项、#16—#18 第 18 题题干三行、#19—#21 **第 18 题的汇编代码三行**（y310.5—338.2，字高仅 6.5pt，比正文小一档，x 从 148 起 —— 比正文左边距 117 缩进 31pt，正是代码框的位置）、#22—#23 第 18 题选项两行两列、#24 第 19 题题干、#25—#28 第 19 题 A—D、#29 第 20 题题干、#30—#31 第 20 题选项两行两列、#32 第 21 题题干、#33—#34 第 21 题选项、#35 第 22 题题干、#36—#39 第 22 题 A—D、#40 第 23 题题干、#41 页脚。**本页无插图**：唯一的高带是 #19—#21 那三行浅灰代码（各 6.5pt，加起来 28pt），不是图，figures.yml 不登记。**第 18 题的汇编代码**是浅灰印刷、字号小一档，4 倍整页只能看出大概，故用 8 倍 `s4p4q18code.png`（灰拉 90—235）与 14—16 倍单字 `s4p4q18t0.png` / `s4p4q18op1.png` / `s4p4q18sub.png` 逐字读定，三行是 `and $t0, $s1, $s2` / `sub $t1, $s3, $s4` / `sub $s0, $t1, $t0`。**寄存器前的 `$` 符号在本卷印得与 `s` 形近**（底本这里是一团没有竖笔的 S 形墨块，180dpi 下竖笔整个丢掉；题干 `对应寄存器 $s0、$s1、…` 处 16 倍 `s4p4q18s0.png` 同样只见 S 形），按 MIPS 汇编语法写 `$`——这是**语法归一化**而非补字，逐处点名于此；判定依据另有语义互证：把三行读成 `t0 = g&h`、`t1 = i-j`、`s0 = t1-t0` 后，恰好等于选项 A 的 `f = (i - j) - (g&h)`，若把 `$` 读成别的字（或把 `and`/`sub` 的寄存器顺序读错）就凑不出任何一个选项——这是本页最硬的一处交叉校验。助记符是小写 `and` / `sub`（14 倍 `s4p4q18sub.png` 下首字母是两笔弧线的 `s`，不是 `S`；OCR 把第三行的 `sub` 读成 `qns`、并把三行拆成六行）。**第 14 题的引号**：`\"0\"` / `\"1\"` 在 4 倍下是两点直竖、无起收笔弯曲，按本卷口径写 ASCII（OCR 读成中文弯引号 `“0”`）。**第 14 题 B 项的末位数字**：`最大为 123`（4 倍与 14 倍 `s4p4q14b_num.png` 两次读数一致：末位是上弧下弧的 `3`，不是 `6`——6 的下半是闭合环、左上有上伸笔）。**第 15 题的 `A-B`**：底本印作 `A-B`（短横，两侧无空隙），按公式口径写 ASCII `-`。**第 17 题的 `256M × 64 位`**：乘号是印刷的 `×`（不是 `x`），两侧留空格照抄；`80ns` 的 `n` 与 `s` 在 4 倍下清楚。**第 20 题 D 项的 `μPC+1`**：第一个字符是希腊小写 `μ`（带下伸尾），6 倍 `s4p4q20cd.png` 下确认，不是拉丁 `u`。**第 22 题的 `I/O`**：正文里印的是正体 `I/O`（斜杠两侧无空格）；OCR 在 A、B 两项把它读成 `VO`、在 C 项读成 `IVO`。**第 23 题题干**：底本 `正确的有 （ ）` 的 `（` 前有一个排版空隙，按本卷口径归一为 `正确的有（ ）`（不留空格）。**OCR 误识已按页图改回**：`一个S位`→`一个 8 位`、`S位加法器`→`8 位加法器`、`采川`→`采用`、`偏院值`→`偏置值`、`简置值`→`偏置值`、`12S`→`128`、`此密数`→`此整数`、`此获数`→`此整数`、`侧此整数`→`则此整数`、`刷此整数`→`则此整数`、`Cachc`→`Cache`、`S0OMB/s`→`800MB/s`、`SSO/SSI/SS2/SS3/SS4`→`$s0/$s1/$s2/$s3/$s4`、`缓码法`→`编码法`、`宇段`→`字段`、`qns`→`sub`、`VO`/`IVO`→`I/O`。**标点**逐处：第 14 题「组成，采用」「表示，则」「正确的是（ ）。」、A「移码表示，偏置值为 127，则」、C「补码表示，则」；第 15 题「机器数分别是 BCH 和 71H，」「加法器中计算 A-B，那么」「分别是（ ）。」；第 16 题「存储器中，属于易失性存储器的是（ ）。」；第 17 题「交叉存储器，」「256M × 64 位，若」「80ns，那么」「最大带宽是（ ）。」；第 18 题「以下对应：」「分别对应寄存器」「$s4。一条 C 语言赋值语句编译后生成如下代码序列。」「这条 C 语言赋值语句是（ ）。」；第 19 题「描述中，正确的是（ ）。」及四项句末无标点（照印刷）；第 20 题「控制器中，」「是由（ ）得到的。」；第 21 题「选项中，不会引起指令流水线阻塞的是（ ）。」；第 22 题「叙述中，错误的是（ ）。」、A「显卡或网卡之类的一种外设控制逻辑」、B「数据宽度与设备侧数据宽度不一定相同」、C「统一编址时，根据指令类型可区分访问主存还是访问 I/O 端口」、D「统一编址时，可利用主存的存储保护措施对 I/O 端口进行存储保护」；第 23 题「下列说法中正确的有（ ）。」。页眉「27考研408模拟卷4·试题」与页脚「第 4 页 / 共 10 页」属版式、不转录"

- page: 5
  source: "4 倍两半 `build/_scratch/probe/s4p5top.png`（上半，y0—420）/ `s4p5bot.png`（下半，y405—841）直读第 23 题的四项陈述与第 24—30 题（本页**从第 23 题的 I 项起页**，题干在上一页末尾；本页只印到第 30 题题干，选项在第 6 页）。墨迹带由 2.5× 灰度位图逐行统计量得 47 条（`build/_scratch/probe/s4p5_bands.txt`）：带 #1 = 页边残点（y2.8—9.2、x532.2—535.0，2.8pt 宽、整页别的行都不碰它，非文字，不转录）、#2 = 页眉（居中 x236.8—358.0）、#3—#6 = 第 23 题 I—IV（#6 只有 11.7pt 宽、x119.5—131.2，是 III 项**折行后的末字**「口。」）、#7 = 第 23 题选项四列、#8—#9 = 第 24 题题干两行、#10 = 第 24 题选项四列、#11 = 第 25 题题干、#12—#15 = 第 25 题 A—D（各占一行）、#16—#17 = 第 26 题题干两行、#18 = 第 26 题选项四列、#19—#20 = 第 27 题题干两行、#21—#33 = 第 27 题的**页表**（横线在 y348.8 / 364.5 / 380.2 / 395.5 / 415.5 / 432.5，竖线 x≈258—323；中间 0.8—1.5pt 的细带是竖线与横线的交叉处、不是字）、#34 = y450.8 的引导句、#35 = 第 27 题选项四列、#36—#38 = 第 28 题题干三行、#39 = 第 28 题选项四列、#40—#42 = 第 29 题题干三行、#43—#44 = 第 29 题选项两行两列、#45 = 第 30 题题干、#46 = 页脚。**第 27 题的页表**按 GFM 表格转录（语料先例：set-3 第 5 页的段表、set-2 第 3 页第 12 题与第 5 页的资源分配表），框线不抄进正文；表体为表头 + 5 行：`0/100`、`1/68`、`2/36`、`3/50`、`…/…`。**这张表有一处自洽校验**：题给逻辑地址 16 位、页大小 2KB（页内偏移 11 位），故 0x1234 的页号 = 0x1234 >> 11 = 2、页内偏移 = 0x1234 & 0x7FF = 0x234；表里页 2 → 页框 36 = 0x24，物理地址 = 0x24 << 11 | 0x234 = 0x12234，正好是选项 B——说明表里「2 → 36」与题干的位数、页大小三处互洽（若 36 读成 35 或 38 就凑不出任何一个选项）。**残损/极淡的字逐个点名**：①第 26 题题干首字「计」几乎只剩一点残笔（`s4p5q26a.png`，10 倍，x100—300），按「计算机系统按字节寻址」补回；②第 26 题题干第 2 行开头「位表」二字墨色极淡、只剩残笔，「示」尚可辨（`s4p5q26c.png`，10 倍），而上一行末尾正是「页表用 3」，与「位」接成「3 位」、与「示」接成「表示」，据此补回；③第 28 题题干首字「文」只剩右侧残笔（`s4p5q28.png`，5 倍），按「文件系统使用 FAT 方式」补回；④第 30 题题干首字只剩一竖（形如「卜」的左半，`s4p5q30.png`，8 倍），按同卷第 23、25 题的「下列关于…」句式补回「下」；⑤第 27 题选项 A 的标记只剩一个点（`s4p5q27opt.png`，8 倍）——这条原由 `recovered-lines.yml` 的 `q: 27 / opt_mark` 补「·」，本页改人工直读后**该条已随之删除**（整页交人工后锚点不再存在，留着会让 `apply_recovered` 报锚点缺失），此处按版式补「A.」，并把「底本此处标记残损」记在这一行。**第 26 题的「页表用 3 位」在 18—24 倍下逐字定过**（`s4p5q26e.png`：`页` `表` `用` `3` 四字齐备，「页」「表」之间**没有**「项」字——底本就是这么印的，照抄不改）。**第 24 题的「中共有」**：`s4p5q24b.png`（18 倍）下「系统」之后是「中共有」，**没有**「一」字（5 倍整行会把字距糊成「中一共有」的样子，故用 18 倍定案）。**第 23 题四项的句末**：I 项、III 项印有句点，II 项、IV 项**没有**——照印刷，不补。**第 25 题的句末**：A 项没有句点，B、C、D 三项有——底本如此，照抄。**第 23 题选项** `1个` / `2个` / `3个` / `4个`：数字与「个」之间印刷无空格，照抄（同第 2 页第 3 题 III 项「含有4个结点」的先例）。**第 26 题选项**的数字与「位」之间印刷**有**空格（`A. 20 位，32B`），照抄。**第 27 题四个选项的十六进制串**在 8 倍下逐个数字确认：`0x12334` / `0x12234` / `0x43210` / `0x22234`（OCR 草稿在此处丢掉了 A 的标记，正文四个串本身读对）。**第 28 题的 FAT 参数**照抄为「用 1 位表示占用，1 位表示损坏」（数学上更像是「2 位」，但底本印的是两个「1 位」，按不自行改写原题的原则保留，疑点记进 meta.yml）。**负号**：第 24 题选项的 `-10` / `-6` / `-7` / `-3` 按公式口径写 ASCII `-`。**第 29 题的路径**照抄为无空格的 `/usr/bin/vim`、`/media/disk`。**标点**逐处：第 23 题 I「环境中，」「进程越多，」「利用率越高。」、III「包括联机接口和脱机接口，」「是一种脱机接口。」、IV「虚拟内存管理技术与文件管理技术，」「方便易用，」「节省空间」；第 24 题「某时刻，」「打印机，」「互斥访问，则」「是（ ）。」；第 25 题「描述中，」「差不多。」「多线程技术。」「完成。」；第 26 题「按字节寻址，」「1MB，」「的页组成，」「执行权限，则」「长度为（ ）；页表总长度为（ ）。」（分号，两个并列设问）；第 27 题「管理系统中，」「16 位，」「18 位，」「2KB，」「部分页表如下。」「物理地址为：」；第 28 题「组织文件，」「4KB，」「32 位，」「表示占用，」「表示损坏，」「表示块号，则」「最大长度为（ ），」「大小分区的 FAT 表长度为（ ）。」；第 29 题「系统中，」「文件系统中。」（句号，换句）「路径名为/usr/bin/vim 的文件，」「被挂载到/media/disk 处，则」「路径名是（ ）。」；第 30 题「描述中，」「正确的是（ ）。」。页眉「27考研408模拟卷4·试题」与页脚「第 5 页 / 共 10 页」属版式、不转录"

- page: 6
  source: "4 倍两半 `build/_scratch/probe/s4p6top.png`（上半，y0—420）/ `s4p6bot.png`（下半，y405—841）直读第 30 题的五项陈述与第 31—37 题（本页**从第 30 题的 I 项起页**，题干在上一页末尾；本页只印到第 37 题题干，选项在第 7 页）。墨迹带由 2.5× 灰度位图逐行统计量得 37 条（`build/_scratch/probe/s4p6_bands.txt`）：带 #1 = 页眉（居中 x236.8—358.0）、#2—#6 = 第 30 题 I—V、#7 = 第 30 题选项四列、#8 = 第 31 题题干、#9—#12 = 第 31 题 A—D（各占一行）、#13 = 第 32 题题干、#14—#17 = 第 32 题 A—D、#18—#19 = 第 33 题题干两行、#20—#21 = 第 33 题选项两行两列、#22—#23 = 第 34 题题干两行（#23 只有 52pt 宽，是折行后的「输速率为（ ）。」）、#24 = 第 34 题选项四列、#25—#27 = 第 35 题题干三行、#28 = 第 35 题选项四列（h=7.2pt，四个纯数字选项没有上下伸笔）、#29—#30 = 第 36 题题干两行、#31 = 第 36 题选项四列、#32—#35 = 第 37 题题干四行、#36 = **第 37 题的插图**（y588.0—646.5、x231.8—387.0，58.5pt）、#37 = 页脚。**第 37 题的图**按 `figures.yml` 的 q37 条裁进 `assets/q37-fig.png`（登记依据见该条 source）；正文不抄图内标注，题干里的「如下图所示」照抄。**第 30 题的 I 项标记**：20 倍 `s4p6q30i.png` 下只剩一根竖线、**右侧没有句点**（II—V 四行的句点都在），而这一整行墨色明显比其余四行浅（扫描掉墨）；标记后按同组四行的「I./II./III./IV./V.」版式补一个句点——**这是按同组标记补回一个被扫描吞掉的标点**，点名在此（补法与第 3 页第 10 题补回印刷残损的「下」同一性质）。**第 30 题五项与四个选项的句末**：只有 IV 项印有句点（I、II、III、V 都没有），照印刷；选项是 `A. I、III` / `B. I、IV` / `C. II、IV` / `D. I、V`（顿号，区分项之间不留空格之外的空隙）。**第 31、32、36 三题的题干末尾**：`（ ）` 之后**没有**句点（16 倍 `s4p6q31tail.png` / `s4p6q32tail.png` / `s4p6q36l2.png` 逐处确认；而第 33、34、35、37 题的题干末尾印有句点）——底本混排如此，照抄不统一。**第 33 题的四个选项**在 16 倍 `s4p6q33a.png` / `s4p6q33c.png` 下逐字确认：`比特流、数据帧、数据分组` / `数据帧、数据分组、报文段` / `比特流、数据分组、报文段` / `报文段、数据分组、数据帧`（OCR 草稿把 A、C 两项毁成 `比特流`、`报义层` 等，且丢掉项间顿号）。**第 34 题的选项**是 `50Baud` / `100Baud` / `50kBaud` / `100kBaud`（`k` 是小写，`Baud` 首字母大写，照抄）。**第 35 题的 `3bit`** 印作半角无空格（不是 `3 bit`），`t 时段` 的 `t` 是斜体拉丁小写、与中文之间留空格，照抄。**第 36 题的生成多项式**在 14 倍 `s4p6q36poly.png` 下是 `P(x) = x^{3} + 1`：`3` 是上标（基线抬高、字号小一档），按本卷口径写 `^{}`；`P` 与 `x` 是斜体。**第 37 题的四个 MAC 地址**在 7 倍 `s4p6q37.png` 下逐字确认：`01-23-45-67-89-0a`、`01-23-45-67-89-0b`、`01-23-45-67-89-0c`、`01-23-45-67-89-0d`（末字节是 `0a`—`0d` 小写十六进制，连字符是印刷的短横）。**标点**逐处：第 30 题 I「用户提供文件名和文件路径」（无句末标点）、II「FAT 从磁盘中复制到内存中」（无）、III「可能会失败」（无）、IV「任何文件系统中，」「文件的内容。」、V「指向文件的硬链接」（无）；第 31 题「（SSD）的说法中，」「错误的是（ ）」及四项句末均有句点；第 32 题「描述中，」「正确的是（ ）」、A「分成多个逻辑分区」（无）、B「可以直接存储数据」（无）、C「随时执行，而不会破坏数据。」、D「分配文件系统，并初始化其元数据结构。」；第 33 题「体系结构中，」「由 SDU 和 PCI 构成，」「第一层、第二层、第三层的 SDU 分别为（ ）。」；第 34 题「10kHz，」「30dB，」「ASK 调制，」「传输速率为（ ）。」；第 35 题「传输数据，」「进行编号，」「0 时刻开始，」「发送数据，」「5 号数据帧后，」「3 号数据帧的确认，」「未收到任何确认帧且发送的帧未超时，」「数据帧数为（ ）。」；第 36 题「101110，」「x^{3} + 1，则」「FCS 应为（ ）」；第 37 题「如下图所示，」「89-0a，」「89-0b，」「89-0c，」「89-0d，」「IP 分组的 IEEE 802.11 数据帧给 H2，则」「地址 1、地址 2、地址 3 和地址 4 分别是（ ）。」。页眉「27考研408模拟卷4·试题」与页脚「第 6 页 / 共 10 页」属版式、不转录"

- page: 7
  source: "4 倍两半 `build/_scratch/probe/s4p7top.png`（上半，y0—420）/ `s4p7bot.png`（下半，y405—841）直读第 37 题剩余选项与第 38—41 题（本页**从第 37 题的选项 A 起页**，题干在上一页；本页印到第 41 题的前两段，第 41 题的设问在第 8 页）。墨迹带由 2.5× 灰度位图逐行统计量得 32 条（`build/_scratch/probe/s4p7_bands.txt`）：带 #1 = 页眉、#2—#5 = 第 37 题 A—D（各占一行，h=7.8—8.2pt、没有上下伸笔，因为它们全是十六进制串）、#6 = 第 38 题题干、#7—#10 = 第 38 题 I—IV、#11 = 第 38 题选项四列、#12—#15 = 第 39 题题干四行（#15 只有 36pt 宽，是折行后的「口为（ ）。」）、#16 = 第 39 题选项四列、#17 = 第 40 题题干、#18 = 左侧页边的**扫描残点**（y294.5—297.0、x110.0—111.0，2.5pt 高、1pt 宽，不是字；OCR 把它当成一个字符读进去过）、#19—#22 = 第 40 题 A—D、#23 = 大题标题「二、综合应用题：41～47 小题，共 70 分。」、#24—#28 = 第 41 题题干五行、#29 = **第 41 题的基数树插图**（y464.2—621.0、x209.0—383.5，156.8pt）、#30—#31 = 第 41 题规则句两行、#32 = 页脚。**第 41 题的图**按 `figures.yml` 的 q41 条裁进 `assets/q41-fig.png`（登记依据见该条 source，含「按路径读出的五个关键字恰好等于题给集合 S」的自洽校验）；正文不抄图内标注。**第 37 题的四个选项**在 7 倍 `s4p7q37opt.png` 下逐字确认：四个 MAC 串之间是**全角逗号**（`0c，01-23…`，不是 OCR 读成的句点），串内是半角连字符；四个选项依次为 `0c/0b/0d/0a`、`0a/0d/0b/0c`、`0a/0b/0c/0a`、`0d/0c/0b/0a`。**第 38 题的选项取 14 倍定案**：整页 4 倍图与 7 倍图在 A、B 两项的先后上给出过互相矛盾的读法（4 倍像 `A. I、II、IV / B. I、II、III`，7 倍像 `A. I、II、III / B. I、II、IV`），再以 14 倍 `s4p7q38opt.png`（x105—340）/ `s4p7q38opt2.png`（x330—520）逐字复读，定为`A. I、II、III`、`B. I、II、IV`、`C. II、III、IV`、`D. I、II、III、IV`。**第 39 题的底本缺陷照抄**：题面写的是「已经建立了 TCP **建立**」（16 倍 `s4p7q39a.png` 下两字是「建」「立」，不是「连接」）——语义上应为「TCP 连接」，按不自行改写原题的原则**原样保留**，疑点记进 meta.yml。**第 39 题第二行的句读**：「…将数据提交给应用层」与「初始的拥塞控制阈值为 4KB」之间只量到约两个字符宽的空隙、**没有可辨的标点**（14 倍 `s4p7q39c.png`），按句子结构补一个逗号（同第 2 页第 2 题「指针。/现要」的补法），点名在此。**第 38 题的题干末尾**（16 倍 `s4p7q38tail.png`）与**第 36 题同例**，`（ ）` 之后没有句点；而第 39、40 题的题干末尾印有句点——底本混排，照抄。**第 41 题的分数标记**写作 `（10分）`（全角括号、数字与「分」之间无空格），与该卷 set-3 第 41 题的`（8分）` 同一口径；OCR 读成 `(10 分)`。**「基数树」**在 6 倍 `s4p7q4041.png` 下三处（题干两处、规则句一处）逐字一致，不是「字典树」。**集合 S 的写法**：`S = {1011, 10, 011, 100, 0}`——花括号与逗号是 ASCII、逗号后留一个空格，照印刷。**省略号用 `⋯`**：16 倍 `s4p7q41tail.png` 下 `a_{0}a_{1}⋯a_{m}` 的三点是**居中**的三点（数学省略号），与该卷既有先例 exams/2026 的 `1, 2, ⋯, n` 一致，不写 `…`；下标按本卷口径写 `_{}`。**标点**逐处：第 37 题选项内用全角逗号；第 38 题「路由算法中，」「说法正确的是（ ）」、I「RIP、OSPF、BGP 均为工作在网络层的协议」、II「小型的、静态的网络，」「大型的、动态的网络」、III「最多能到达 16 跳，OSPF 无限制」、IV「路由信息为完整的路由表，」「为直连的链路状态」；第 39 题「进行数据传输，」「接收窗口为 30KB，」「提交给应用层，」（补的逗号）「阈值为 4KB，」「后（之前未发生拥塞），」「重复 ACK，」「当 7 个 RTT 后，」「发送窗口为（ ）。」；第 40 题「叙述中，」「错误的是（ ）。」、B「C/S 模型中，」；第 41 题「组成的字符串，」「数据结构来存储，在基数树中，」「赋予 0，」「赋予 1 的规则，」「每个结点的关键字，」「简单路径来确定。」「例如，」「集合 S」「基数树中，」「不属于集合 S（」；规则句「1 组成。」「两个关键字 a = …，b = …，」「之一成立，」「则可判定 a < b：」。页眉「27考研408模拟卷4·试题」与页脚「第 7 页 / 共 10 页」属版式、不转录"

- page: 8
  source: "4 倍两半 `build/_scratch/probe/s4p8a.png`…`s4p8f.png`（y40—660 分六条横带）直读第 41 题后半与第 42—43 题（本页从第 41 题的规则段起页，第 41 题的设问在上一页）。墨迹带由 2.5× 灰度位图逐行统计量得 36 条（`build/_scratch/probe/s4p8_bands.txt`）：带 #0 = 页眉、#1—#2 = 规则一两行、#3 = 规则二一行、#4—#5 = 「例如」两行、#6 = 引导句、#7 = （1）、#8—#9 = （2）两行（#9 缩进 139pt = 折行，与该小题合并）、#10—#11 = （3）两行（#11 缩进 = 折行）、#12—#14 = 第 42 题题干三行（#12 起始 x100.4 = 题号悬挂）、#15—#19 = 第 42 题的结构体代码五行（等宽字体，带高 4—7pt 是因为没有上下伸笔；「const int MAX_SIZE = 200;」带宽 125.0pt ÷ 26 字符 ⇒ 字宽 4.8pt，据此量出 `int n;` 的缩进 = 16.5pt ≈ 3.4 个字符，转录时按 C 习惯写成 4 个空格，其余空格照印刷）、#20 = 「请给出…要求：」、#21—#23 = 第 42 题（1）（2）（3）、#24—#26 = 第 43 题题干三行、#27—#30 = 汇编清单（七行挤成四条带，带高 16—17pt 是把相邻两行连在一起了）、#31 = 「计算机 M 的指令格式及其说明如下：」、#32 = 表头行、#33 = 指令格式表（y567—633，带高 66pt）、#34 = 「其中，op1～op3 为操作码…（寄存器 R0、R1、R2、R3、R4 编号」、#35 = 页脚（y748，19px 宽）。**本页没有任何插图**（#33 是表格不是图），故本页不新增 figures.yml 条目。**「例如」一句的标点按连通域尺寸定案**（`build/_scratch/probe/s4p8cc.txt`、`s4p8cc2.txt`）：已确证的「，」在本页量得 w4—5 / h6—7 / px20—21（如「例如」后 x140.80、表下「其中」后 x142.60），已确证的「、」量得 w5—6 / h5 / px14—16（如「rs、rt、rd」之间的 x245.40、x260.40）；而「101」后 x201.20 = w5 h6 px21、「110」后 x239.60 = w5 h5 px20、「1011」后 x494.60 = w4 h7 px21，**与逗号同类、与顿号不同类**，故写作全角逗号；「整数 x」后的标点另用 25 倍图 `s4p8r1z.png` 直看（带下垂小尾 = 逗号）。**「规则一」句里的 `x-1`**：印刷是居中的减号，按本卷口径写 ASCII 减号；`a_{j}`、`b_{j}`、`a_{x}`、`b_{x}` 用 `_{}` 下标。**「（x = 1）」「（m = 2, n = 3）」写成 ASCII 括号**（公式括号），与本卷既定口径一致；句中的「；」是全角分号。**省略号用 `⋯`**（数学省略号，与第 7 页同一口径）。**小题号（1）（2）（3）统一成全角括号**：印刷上第 42、43 题混用了半角 (1)、(2) 与全角，本卷统一按全角写（与 set-3 一致）。**分数标记写作「（13分）」**：印刷是半角 (13 分)（数字与「分」之间有空格），按本卷既有口径（第 7 页第 41 题的「（10分）」、set-3 第 41 题的「（8分）」）归一。**第 42 题题干里的「n 个顶点」**：6 倍图下是斜体 n，不是 π（OCR 草稿读成 π），`AdjGrid[i][j]`、`AdjGrid[j][i]` 的方括号也逐字核过。**第 43 题的代码段**：`while(arr[i] == k) i += 1;` 在 5 倍图下逐字确认——是双等号 `==`、`arr`、`[i]`，OCR 草稿把它读成 `while(ar[i]=k）i+=1;`（少一个等号、方括号成了全角括号）；底本用弯引号把这句括起，引号按本卷口径改成 ASCII 竖引号。**汇编清单**逐行在 5—12 倍图下读出（`s4p8e.png`、`s4p8asm3c.png`、`s4p8asm7.png`）：第 3 行的`load R4,0(R1)` 在 12 倍图下能看到 R4 与 0 之间确有逗号（不是句点）；第 4 行 `bne R4,R0,exit` 三个逗号同样确认；第 7 行是 `exit:`（带冒号、无操作数）。列的排布按量得的 x 位置重建：序号 x137、地址 x150、标号 x190、助记符 x215、操作数 x233、注释列 x272（等宽字体字宽 3.4pt），转录时按 0/4/16/22/27/39 列对齐，空格是重建的、不是逐个数的；注释列里的箭头是 `→`。**指令格式表按 GFM 写**：底本用合并单元格——I 型的 imm 横跨「5 位、5 位、6 位」三格（共 16 位），J 型的 imm 横跨后五格（共 26 位）；GFM 不能合并单元格，故把合并值写在最左一格、其余格留空（`| |`），列宽合计 6+5+5+5+5+6 = 32 位，与 I 型 6+5+5+16、J 型 6+26 自洽。「6 位」「5 位」数字与「位」之间**有空格**：量表得该缝 2.4pt，而同一行相邻汉字的字缝只有 0.7pt（`build/_scratch/probe/s4p8hdr_gap.txt`），与「PC 的低 26 位」里的空格同一量级。表右侧说明列的「含 ALU 运算，条件转移和访存操作 3 类指令」在 5 倍图下是两行、末尾无句号，转录时因是表格单元格而写成一行。**本页末行是一句没写完的话**（「…（寄存器 R0、R1、R2、R3、R4 编号」），下半句在第 9 页页首，所以第 9 页的转录**不能以空行开头**，否则这句会被切成两段。页眉「27考研408模拟卷4·试题」与页脚「第 8 页 / 共 10 页」属版式、不转录。"

- page: 9
  source: "4 倍四条横带 `build/_scratch/probe/s4p9a.png`…`s4p9d.png`（y44—672）直读第 43 题后半、第 44 题与第 45 题（本页自第 43 题「分别为 0、1、2、3、4），imm 为立即数。」起页——**这句话是第 8 页末行的下半句**，所以本页第 1 行不前面留空行，否则会被切成两段）。墨迹带 30 条（`build/_scratch/probe/s4p9_bands.txt`）：带 #0 = 页眉、#1 = 半句、#2 = 「请回答下列问题：」、#3 = （1）、#4—#5 = （2）两行、#6—#7 = （3）两行、#8—#10 = （4）三行、#11—#14 = 第 44 题题干四行、#15 = **第 44 题的数据通路插图**（y270—449，178.8pt 高）、#16 = 第 44 题的「请回答下列问题：」、#17 = （1）、#18 = （2）、#19—#20 = （3）两行、#21—#22 = （4）两行、#23—#26 = 第 45 题题干四行、#27 = （1）、#28 = （2）、#29 = 页脚（y748）。**本页版心与第 8 页不同**：本页正文左边界 x104—105、右边界 x497—503，第 8 页是 x120—121 / x508—509；两页页眉的 x 位置相同（237—356），说明不是扫描偏移，而是底本这两页的版心本来就不同，故本页按本页的 x 判折行。**第 44 题的插图**按 `figures.yml` 的 q44 条裁进 `assets/q44-fig.png`（登记依据见该条 source，含三条自洽校验）；图内标注不抄进正文。**「写人」还是「写入」**：30 倍图 `s4p9q44w.png` 下「数据写入 MDR」的第四字左撇短、右捺长，是**入**不是人（OCR 草稿读成「写人」），按底本写作「写入」。**「GPRs」**（不是 GPR5）：第 44 题题干与图内标注两处一致，是下标 s；OCR 草稿把它读成 `GPRs`/`GPR5` 混排。**「且则哪些指令可能会导致控制冒险」照抄**：第 43 题（3）第二行（10 倍图 `s4p9q43p.png`）确系「且则」二字，读不通是**底本自身的用词问题**（疑为「那么」或「则」的衍字），按不改写原题的原则原样保留、记进 meta.yml。**第 45 题的「5 类临界资源」也照抄**：题干列出的资源是 R1、R2、R3、R4 **四种**、数量四个（1、2、2、1），「5 类」与清单不符，属底本自相矛盾，原样保留、记进 meta.yml。**第 43 题（4）的「rd，rs 字段为 0」**：10 倍图 `s4p9q43p2.png` 下 rd 之后是带小尾的逗号（不是句号），写作「，」。**操作码 10H、11H、12H、13H**：OCR 草稿读成 `10H、1IH．I2H、13H`（把两个 1 读成字母 I、顿号读成句点），5 倍图下四个都是数字 1、四个之间都是顿号。**引号**：第 43 题（3）的「取指、译码/取数、执行、访存、写回」底本用弯引号，按本卷口径写 ASCII 竖引号；「译码/取数」中间是半角斜杠。**分数标记**：第 44 题的 (10 分)、第 45 题的 (8 分) 印刷为半角括号且数字与「分」间有空格，按本卷口径写作「（10分）」「（8分）」。**小题号统一全角**（与第 8 页同一口径）。**标点判读口径**：本页的小标点（逗号/顿号/句号）在 180dpi 下都是 4—6px 的团块，逐个用连通域尺寸分类（逗号 w4—5·h6—7·px20±、顿号 w5—6·h5·px14—16、句号是空心小圈），尺寸分不开的按句法定，并已在上面逐处点名。**「阵/陈」一类形近字**逐处按 8 倍图核过：（3）的「该指令序列中」、（4）的「移位」「算术左移」、（1）的「编址单位」、（2）的「并行进位加法器」。页眉「27考研408模拟卷4·试题」与页脚「第 9 页 / 共 10 页」属版式、不转录。"

- page: 10
  source: "页图直读（原生 2.5px/pt 灰度，阈值 170，MID x40—556，GAP3）：本页 24 条墨迹带 —— #0 y24—32 页眉「2027 模拟 4」；#1—#3 = 第 46 题题干三行（y49.0—59.0 / 64.0—74.0 / 80.0—89.0，首行 x98 起、「46.」悬挂在版心外）；#4 y98—199 x149—461 = 第 46 题的 DMA 控制器插图（101pt 高带，本页第一张图）；#5 y208—218 = 「请回答下列问题。」；#6—#7 = 46 题（1）（y226—235 顶格 x118、续行 y241—250 缩进 x137）；#8 y257—266 = 46 题（2）；#9—#11 = 46 题（3）三行；#12—#13 = 第 47 题题干两行（y319—329 首行 x98 起、「47.」悬挂）；#14—#16 = 47 题（1）三行；#17—#18 = 47 题（2）两行；#19 y430—447 x164—451 = 路由表格式（17pt 高的窄带，只有一行表头，不是图）；#20—#21 = 47 题（3）两行；#22 y489—655 x165—534 = 第 47 题的网络拓扑图（166pt 高带，本页第二张图）；#23 y748—757 页脚。**版心**：本页正文左沿 x117—119、右沿 x512—516，「（1）」类小题缩进 x137；与第 8 页（x120/509）、第 9 页（x104/503）都不同，说明本卷各页版心不统一，逐页按本页自己的 x 判缩进与续行。**两张图**都进了 figures.yml（q46 / q47），这里只记归属依据：图一夹在 #3（题干末行）与 #5（请回答下列问题）之间，图二夹在 #21（47 题（3）末行）之后、页脚之前；两张都是本页唯一的高带，上下都不与正文相碰。**底本瑕疵（照印刷抄，不改）**：第 47 题题干「某网络拓扑所下图所示」——「所」应为「如」，24 倍图 s4p10suo2.png 下「所」的户+斤结构清楚，不是「如」的误读；已记入 meta.yml 待办。**标点判定口径（本页与第 8 页不同，务必按本页实测）**：第 8 页量出的「逗号 w1.6—2.0pt / h2.4—2.8pt / px20—21、顿号 w2.0—2.4pt / h2.0pt / px14—16」这套尺寸类**在本页失效**：本页已确认的顿号（46 题（3）「用户层软件、与设备无关的 I/O 软件、」两处，实测 x366.4 处 7×6px px21、x468.8 处 6×7px px20）与逗号类完全重叠，只靠连通块尺寸分不开。改用两条：① 10—12 倍形态（顿号是短斜、无尾；逗号带下垂尾）；② 语法（分句之间不可能是顿号）。按这两条，本页枚举两处判顿号（「用户层软件、与设备无关的 I/O 软件、设备驱动」「部门 1、部门 2 和部门 3」），其余分句、并列短语之后一律判逗号。唯一一处灰度上分不清的是 47 题题干「某网络拓扑所下图所示」后面那个标点：60 倍图 s4p10mk60.png 是 4×5px 的实心块（px17），比第 8 页的逗号（4×6px px20）略矮、比句号（6×4px 带孔，见 18 倍图 s4p10xiaox.png 里「表项尽可能小。」的句号）明显不同类，故判逗号而非句号。**跨行拼接**（本页三处，拼出来才是原文）：#14 末「…已知三个部门的员工数始」+#15 首「终按照…」=「始终按照」；#10 末「…？计算数据所」+#11 首「在磁盘的柱面号…」=「计算数据所在磁盘的柱面号…」；#17 末「…并使得路由」+#18「表项尽可能小。」=「路由表项尽可能小」。**逐字复核**：46 题（3）「程序和中断处理程序」的「断」用 20 倍图 s4p10duan.png 确认（左米右斤），OCR 草稿在这里出过「中新」；「4 个层次」的「4」在 12 倍图 s4p10q46c1.png 下清楚；47 题（1）的地址空间用 10 倍图 s4p10ip.png 确认为 130.120.10.0/24（不是 OCR 草稿里与图内 130.110.x.x 混同的写法）。**表格**：#19 只有一行表头「目的网络 | 下一跳 | 接口」，表体是空的（题目要求考生自己填），GFM 只写表头行+分隔行，不补空表体。**字体口径**：「fread()」「I/O」「RIP」「IP」「DMA」「MAR」「DC」按 ASCII 写；「（7分）」「（9分）」印刷是半角括号带空格「(7 分)」，按全卷口径归一为「（7分）」「（9分）」；47 题（3）的「t 时刻」是斜体 t，按正文写 t。**页首**：第 9 页末段（45 题（2））是完整句，本页另起一道大题，故 page-010.txt **首行留空行**，否则会被 join_lines 并入上一段。本页是卷末（底本共 10 页），末行「…并给出变化理由。」是完整句。"
