# 逐页人工转录的来源登记（mock-2027/set-4 试题卷）
#
# 本卷与 set-2/set-3 同为**扫描件、无文字层**，正文原本由 RapidOCR 识别。识别结果不能当
# 正文用这件事已在 set-2 的 `pages.yml` 文首论证过（180/300 dpi 并排实验：误识逐字相同，
# 是模型层面的错、不是分辨率不够），set-3 又逐页复核了一遍；本卷不再重复论证，只按同一
# 结论执行：**正文逐页人工直读页图**，落在同目录 `pages/page-NNN.txt`，由
# `tools/md_from_pages.py` 的 `load_page_overrides` 取用。
#
# 本卷的 OCR 草稿密度与 set-3 同量级（第 2 页第 1 题的 7 行 C 代码被粘成一行、
# `int`→`Im`、`return`→`roturn`、`=`→`-`、`;`→`:`；第 2 题 `已知—个`、`前墅`、`搭向`、
# `nexL`；第 4 题 `化成`（漏「转」）、`Ms`（M 的下标 1 读成 s）；第 3、6 题整句粘连）。
#
# 转录纪律（与 set-2/set-3 完全一致，见 `load_page_overrides` 的 docstring）：
# 按印刷折行照抄、并排选项拆成一行一个、图/表标注不抄进正文、看不清的字不猜。
# 每条都要写 source：**凭什么说这一页抄对了**（渲染图路径 + 倍率 + 该页要点）。
#
# 全卷统一口径（与 set-3 相同处从简，不同处写明）：
#   · **句末标点写作「。」**：底本句末印的是小实心点，全套语料一律用「。」（归一化，
#     理由与实测见 set-2 的 pages.yml）。
#   · **公式里的括号一律 ASCII**（`O(n)`、`(m + n) / 2`），散文括号与分值写全角
#     `（）`——同为全套语料的归一化。
#   · **上下标：真指数/真下标用 `^{}` / `_{}` 标记**（与 set-3 同口径，与该卷的
#     `O(log_{2}n)` / `O(2^{n})` / `M_{1}` 一致）。
#   · **子问题标记按全角 `（1）`**（本卷题目卷自第 6 页起出现该标记）。
#   · **引号照抄 ASCII `"`**（同 set-3 的判据：40—60 倍下是两点直竖、无起收笔弯曲）。
#   · **题内并排的选项/陈述一律拆成一行一个**（本卷第 2—3 页的 I—IV 陈述、四选项行
#     都是并排印刷；拆行只动版式，不动字）。

# ---------------------------------------------------------------------------
# 【本卷底图的形态】
#
# 试题卷 10 页、每页 595×841 pt，每页是**一整张内嵌 JPEG**（第 2 页 xref 11，
# 1488×2103 px ≈ 2.5 px/pt ≈ 180 dpi），页面上没有任何文字层。因此：
#   · 「渲染倍率」超过 2.5× 只是**插值**，不会多出信息；真正能多看的只有
#     **在原生像素上做灰度拉伸**（`build/_scratch/probe/bin_crop.py`，`--zoom 2.5`
#     取原生位图，`--lo/--hi` 收窄灰度窗把浅灰笔画压黑，再 `--scale` 最近邻放大）。
#   · 本卷**第 1 题的 C 代码块是浅灰印刷**（比正文浅一档，灰度约 190/255），
#     而这份 JPEG 在该灰度上压缩噪声很重：8× 渲染下整块发虚。读它必须走
#     `bin_crop.py` 的灰度拉伸通道，并逐字交叉印证（见下面第 2 页的 source）。
# ---------------------------------------------------------------------------

- page: 2
  source: "4 倍两半 `build/_scratch/probe/s4p2top.png`（上半，x20—575、y0—420）/ `s4p2bot.png`（下半，y405—805）直读第 01—07 题（本页只印到第 7 题题干，选项在第 3 页）。墨迹带由 2.5× 灰度位图逐行统计（阈值 170、每行≥3 个暗像素）量得 43 条，与题号一一对应：带 #1 = 页眉、#2—#3 = 大题说明两行、#4 = 第 1 题题干、#5—#13 = 第 1 题代码块（7 行正文 + 若干残余的断笔碎带，见下）、#14 = 第 1 题选项一行四列、#15 = 第 2 题题干首行（h=16.8pt，因为行内嵌着一个方框）、#16—#17 = 第 2 题题干二、三行、#18—#21 = 第 2 题 A—D（各占一行）、#22 = 第 3 题题干、#23—#26 = 第 3 题 I—IV、#27 = 第 3 题选项一行四列（h=7.2pt，比其他行矮，因为四个选项里没有上下伸笔）、#28—#30 = 第 4 题题干三行、#31 = 第 4 题选项一行四列、#32 = 第 5 题题干、#33—#34 = 第 5 题选项两行两列、#35 = 第 6 题题干、#36—#37 = 第 6 题 A 两行、#38—#39 = 第 6 题 B 两行、#40 = 第 6 题 C、#41—#42 = 第 6 题 D 两行、#43 = 第 7 题题干（y659.2—668.4）。**本页无插图**：唯一偏高的带 #15（16.8pt）已由图与 4 倍渲染证实是第 2 题**结点结构的方框**（三格 `prev | data | next`，框线上下各多出约 3pt），figures.yml 不登记。**第 1 题代码块（本页最费劲的一处）**：底本印的是浅灰字，2 倍、4 倍、8 倍渲染都把 `*arr` 之后的笔画糊成断点；改用原生 JPEG（`doc.extract_image(11)`，1488×2103）裁切 + `ImageOps.autocontrast` + 4× LANCZOS 得 `s4p2code_native.png`，再经 `bin_crop.py`（原生 2.5×、灰度拉伸 178—202 与 155—235 两档，见 `s4p2code_B.png` / `s4p2q1tail.png`）逐行读定，最终 7 行是：`int fun(int *arr, int m, int n)` / `    if (m == n)` / `        return 1;` / `    else {` / `        int mid = (m + n) / 2;` / `        return fun(arr, m, mid) + fun(arr, mid + 1, n);` / `    }`。判据：①**首行的形参表**由第 6 行的两处调用 `fun(arr, m, mid)`、`fun(arr, mid + 1, n)` 互证（形参个数与顺序自洽），首行中间可辨的两处 `int m`、`int n` 与第 2、5 行同一字体的 `m`/`n` 逐字对照一致；②**首行末尾没有左花括号**——`n` 之后只量到一处 2px 宽的短竖（`s4p2q1end2.png`），若是 `) {` 应有两处，故按可见墨迹写「无花括号 + if/else 作函数体唯一语句」；③**第 4 行 `else {` 的左花括号**与**末行 x≈156pt 处那一个 `}`**（`s4p2q1tail.png`，墨形与 `else` 同一竖线起笔，二者左边距对齐）闭合了 else 块，与①互不矛盾；④缩进量自左向右为 x≈139/155/170pt 三级（字符步进约 5pt，即 3 个字符宽），按标准 C 归一化为 0/4/8 空格——这是**版式归一化**，不是照抄缩进像素；⑤低分辨率下 `=` 与 `/` 只剩两点墨，按语义补的是运算符本身、不是数字或字母，且 `(m + n) / 2` 与首行的形参表、第 6 行的 `mid` / `mid + 1` 三处自洽。**第 2 题的结点结构方框**转录为行内 `[prev][data][next]`（语料先例 exams/2015 的 `[data][link]`），框线不抄；OCR 草稿把整句读成 `结点结构为：prev data next`（丢掉“结构”框、`前墅`、`搭向`、`nexL`、`—个`），逐字改正。**第 2 题题干第三句**：底本 `…结点的指针` 与 `现要添加` 之间只有字距空隙、没有可辨的句点（本卷标点墨块仅 2—3pt，理由见 set-3 的 pages.yml 文首），按句子边界取「。」并在下面「标点」里点名。**第 4 题 B 项印的是 `M₂ + M₂`**（不是 `M₁ + M₂`）：4 倍 `s4p2q4opt.png` 与 6 倍重裁两次读数一致，OCR 草稿也读成 `M2+M2`——两个独立通道一致，说明**底本如此**；数学上第 2 棵树的结点数更可能是 `M₁ + M₂`，但按「不自行改写原题」照抄，存疑记进 meta.yml 的 notes。**第 5 题关键字的四个分隔符混印**（`41，38，31．12．19．8`：前两个是逗点、后三个像句点），按语义（关键字序列）统一取「，」，逗点后照抄一个空格。**第 6 题 C 项的 `查找` 二字笔画明显重于同句其他字**（6 倍 `s4p2q6c2.png` 下可见笔画加粗），疑为印刷墨重/加重，未作强调标记处理、也不改字。**第 6 题 B 项的 `后继`**（5 倍 `s4p2q6b.png`）与同卷第 6 题 A 项的 `中序后继`/`中序前驱` 对照确认，不是 `前驱`。**第 7 题题干照抄「陈述说法」**：底本四个字就是「陈述说法」（「陈述」与「说法」语义重复，疑为底本行文，6×7 倍 `s4p2q7stem2.png` 已确认无缺字），不改。**数字两侧的空格**：第 4 题 `3 棵树`、第 5 题 `41，38，…` 各数之间留空格（印刷如此）；第 3 题 III 项 `含有4个结点` / `最多有14种形态` 印刷**没有**空格，照抄。**第 1 题选项**：`O(log_{2}n)` / `O(n)` / `O(nlog_{2}n)` / `O(2^{n})`——`2` 的上下标在 4 倍整页图上可见基线偏移（log 的下标 2 下沉、2ⁿ 的 n 抬高且字号小），按本卷口径写标记式（OCR 草稿读成 `O(logn)`/`O(nlog2m)`/`0(2\")`，下标丢失且 `0` 与 `O` 混淆）。**标点**逐处：第 1 题题干「合法的，则」「是（ ）。」；第 2 题「链表 L，结点结构为」「其中，prev 和 next」「指针。现要」（句点按语义取，见上）；第 3 题「陈述中，正确的是」「先序、中序、后序遍历」（顿号，三项并列）「左右子树的位置，利用」「正好相反，则」；第 4 题「中的 3 棵树，第一、第二、第三条」（顿号）「分别为 M_{1}，M_{2} 和 M_{3}」「二叉树 T，若以」；第 5 题「红黑树后，」「有 2 个红色结点，4 个黑色结点」；第 6 题 A「两个孩子，则它的」、B「为空，且」「后继 y，则」「祖先，且其」「（结点本身也视为自己的一个祖先）」、C「线索树中，」「右线索，不一定能」、D「叶结点，y 是其父结点，那么」「最小关键字，要么」；第 7 题「错误的是（ ）。」。页眉「27考研408模拟卷4·试题」与页脚「第 2 页 / 共 10 页」属版式、不转录（`read_lines` 用 `RE_FOOTER` / `RE_RUNNING_HEAD` 剔除）。量法与裁切脚本：`build/_scratch/probe/bin_crop.py`（原生像素 + 灰度拉伸 + 最近邻放大）；各条的 y 坐标均取自上面那 43 条墨迹带，未用肉眼估坐标"

- page: 3
  source: "4 倍两半 `build/_scratch/probe/s4p3top.png`（上半，y0—420）/ `s4p3bot.png`（下半，y405—841）直读第 07 题剩余选项与第 08—13 题（本页**从第 07 题的选项 A 起页**，题干在上一页）。墨迹带由 2.5× 灰度位图逐行统计量得 36 条（`build/_scratch/probe/s4p3_bands.txt`）：带 #1 = 页边 0.4pt 宽的扫描残点（非文字，不转录）、#2 = 页眉、#3—#6 = 第 7 题 A—D（各占一行，x 起点 98.2）、#7 = 第 8 题题干（x 起点 79.5，比选项靠左 19pt——题号在第 8 题印位）、#8—#14 = 第 8 题四项（A 一行；B、C、D 各两行，第二行的 x 起点 112 = 悬挂缩进）、#15 = 第 9 题题干、#16 = y275.5—370.0 **插图**（94.5pt）、#17 = 第 9 题选项一行四列、#18 = 第 10 题题干、#19—#20 = 第 10 题 I 项两行、#21—#23 = II 项三行、#24—#25 = III 项两行、#26 = 第 10 题选项、#27 = 第 11 题题干、#28—#29 = 第 11 题选项两行两列、#30—#31 = 第 12 题题干两行、#32 = 第 12 题选项、#33—#34 = 第 13 题题干两行、#35 = 第 13 题选项、#36 = 页脚。**第 9 题的图**按 `figures.yml` 的 q9 条裁进 `assets/q9-fig.png`（登记依据见该条 source，含「边方向读对了」的自洽校验）；正文不抄图内结点名。**第 7 题 D 的 `单源`**：4 倍 `s4p3q7d.png` 与 12 倍单字 `s4p3q7d_src.png` 下第二个字左侧是三点水旁，「单源最短路径问题」与同句 `BFS 算法` 自洽（OCR 把整句毁成 `单鹭最短路经向题`）。**第 8 题四项**的 4 倍 `s4p3q8.png` 逐字复核：A `设 (u,v) 是连通图 G 中的权重最小的边`、B `设 e 是连通图 G = (V,E) 的某条环路上权重最大的边`（`e` 是斜体拉丁小写，与 `G`/`V`/`E` 同一斜体）、C `任一连接所有结点且总权重最小的一个边集合必然形成一棵树`、D `如果减小了 T 中的一条边的权重`；OCR 在此页读了 9 处形近误识（`探`→`棵`、`股小`→`最小`、`必德`→`必然`、`生放树`→`生成树`、`C 的一棵`→`G 的一棵`，以及丢掉 B 项句末的 `e`）。**第 10 题的三个 `MINIMAX`**：12 倍 `s4p3minimax2.png` 下是 `M I N I M A X` 七个大写拉丁字母（OCR 这一处读对了），`败者树` 另用 10 倍 `s4p3q10i2.png` 确认（`败` 的贝字旁与 `者` 的日字部件都在，OCR 也读对）。**第 10 题题干的首字**：底本第 10 题题号后的 `下` 字**印刷残损**（只剩一横一短竖，8 倍 `s4p3q10stem.png` 下形如 `卜`），RapidOCR 直接丢了这个字、读成 `10．列关于…`；按同卷第 6、8 题同一句式的 `下列说法/下列关于` 补回 `下`——这是**按同页同句式补回一个印刷残损的字**，字形本身不可辨，点名在此。**第 10 题题干与 III 项的「选择-置换排序」/「置换选择排序」两种叫法照抄**（底本如此，不改）；连字符是短横、两侧有排版间隙，按本卷公式口径归一为 `选择-置换排序`（运算符两侧不留空格）。**第 11 题**：A `快速排序时间性能最佳`、B `基数排序和归并排序是稳定的排序方法`、C `快速排序是一种选择排序`、D `堆排序所用的辅助空间较大`，四项各占一行（OCR 把 C 的标记读成 `C、`）。**第 13 题 D 项的 `128`**：OCR 读成 `12S`，4 倍页图上是 `1 2 8` 三个数字、末位的 8 是闭合的两个圆（`S` 不会闭合），且 A—D 四项是 24/25/126/128 的等差式递进，`12S` 不成数。**上下标**：`(u,v)`、`(V,E)`、`(u,v)` 三处是**公式括号**，按本卷口径写 ASCII；`(u,v)` 里的逗号印刷为半角逗点、无空格（照抄）。**标点**逐处：第 7 题 C「高度一般不小于」、D「权值相同时，」；第 8 题题干「陈述中，错误的是」、A「权重最小的边，那么」、B「权重最大的边，那么」「图 G 中存在一棵不包含边 e 的最小生成树」、C「有正有负，则」「边集合必然形成一棵树」、D「最小生成树，如果」「边的权重，那么」；第 9 题「有序图，该图的」；第 10 题 I「过程中，」「最小值，此过程需利用败者树实现」（`MINIMAX` 前后各留一个空格）、II「记录时，」「关键字值更小，」「一个序号位，」「比较时，」「先比较序号，」「序号大的为胜者；」「（分号，两个分句并列）」「序号相同的关键字值小的为胜者」、III「长度并不受内存容量的限制，且」；第 11 题「方法来说（ ）。」；第 12 题「要执行时，」「机器语言，并且」「执行一句，」「这样的程序为（ ）。」；第 13 题「加减运算，」「阶大的数，」「阶码之差的绝对值大于等于（ ）。」。**并排拆行**：第 7 题的 A—D 在底本上**就是各占一行**（不是拆的）；第 9、10、11、12、13 题的选项在底本上是**一行四列或两行两列**，一律拆成一项一行（只动版式）。页眉「27考研408模拟卷4·试题」与页脚「第 3 页 / 共 10 页」属版式、不转录"

