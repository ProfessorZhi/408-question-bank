# 扫描卷插图的人工登记（mock-2027/set-4）
#
# 理由与 set-2/set-3 相同：本卷 PDF 整页就是一张位图，`fig_crop.py` 的
# 「位图对象/图形簇 + 题注行」两路判据都不存在，跑它只会裁出整页——那正是用户禁止的
# 「整页截图」。所以逐张人工登记区域，`tools/crop_figures.py` 照单渲染。
#
# y0/y1/x0/x1 是 PDF 点坐标（页面 595×841）。定法：2.5×（原生 180dpi）灰度位图逐行统计
# 墨迹带（文字是 8—11pt 的窄带、图是一块几十 pt 的高带），再取该带内逐列墨迹的 x 包围盒，
# 四周留 3—4pt，最后 5× 渲染直读确认图内没有被裹进来的正文行。
#
# `source` 写清「凭什么说这块是第 N 题的图」。**图内标注不抄进正文**（本卷口径与
# set-3 一致：图里的结点名、数值只在图里，正文不重复一遍）。

