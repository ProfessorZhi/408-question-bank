# 逐页人工转录的来源登记（mock-2027/set-3 答案卷／解析卷）
#
# 底本 `sources/mock-2027/pdf/mock2027-set3-solution.pdf` 是**扫描件**（9 页，515.88×728.52），
# 无文字层，初稿来自 RapidOCR。这一卷比 set-2 的答案卷更依赖 OCR，原因是综合题几乎全是
# **版式敏感**的内容：
#   · 第 42 题一段 C 代码（11 行）——OCR 把缩进与空格整块吃掉，`return node -> parent;`
#     只剩 `returnnode->parent；`，收尾的两个 `}` 直接丢失；
#   · 第 44 题「标记／Cache 行号／块内地址」表、第 46 题的 **11 列 × 5 行** FIFO 模拟表与
#     页表、第 47 题的 MAC 表——OCR 把表读成按列散开的单格（FIFO 表被读成 40 行散字）；
#   · 第 45 题公式里的 `256^{2}`、`256^{3}` 上标，第 44 题的二进制分组——OCR 一律压平成
#     `2562`、`0000 0110 0111 1010B` 里丢失分组空格；
#   · 第 41 题第 1 问的**染色示意图**（底本印在本卷第 6 页）——OCR 只留下一个空行。
#
# 所以本卷第 6—9 页（综合题 41（第 2 问起）—47 的全部解答）改为**人工逐页直读页图**，落在
# 同目录 `solution-pages/page-NNN.txt`，由 `tools/md_solutions.py::load_solution_overrides`
# 取用。第 1—5 页仍是 OCR 草稿：那里是卷首答案表 + 选择题 1—40 的解析流（`md_solutions.py`
# 只用它取答案字母，解析正文不进 `solutions.md`），第 5 页末行 `41.【解析】（1）右图不能被
# 二分，左图能被二分，染色情况如下图所示。` 因此仍是 OCR 初稿——这一句的 OCR 结果与页图
# 逐字一致（已核），只是没有登记为人工转录页。
#
# 全卷统一口径（与题目卷 `pages.yml` 同一套，答案卷跟着用；凡属取舍，逐条记在这里）：
#   · **句末标点写作「。」**（底本印的是小实心点，属归一化非临摹）。
#   · **子问题序号全角 `（1）`**（判据见题目卷 `pages.yml` 文首「子问题标记形态」一节）。
#   · **公式紧凑写法**：底本在 `=`/`/`/`×` 两侧加了数学间距（实测 2.0—2.8pt），转录一律写
#     紧凑（`32B/16B=2`、`10+1×256+1×256^{2}`、`410-10-256=144`）——这是全套语料的**归一化**，
#     不是墨迹判定。二进制/十六进制的**分组空格照抄**（`0000 0110 0111 1010B`）。
#   · **上标用 `^{}`**（`256^{2}`、`256^{3}`），与题目卷同一套写法；底本是上标字形，不是 `^`。
#   · **散文括号全角、公式括号半角**（`（即第 E 行）` 对 `i.addr(10)`、`(10+1×256…)×1KB`）。
#   · **短横一律 ASCII `-`**，范围用 `~`（`x[0]~x[3]`）。
#   · **代码缩进**：版面量得三级，级差 **14.5pt**（第 6 页 `Node`／`if`／`Node *t` 三行墨迹
#     左缘 102.0／116.5／131.5pt，等宽字宽约 4.8—5.0pt，即版面约 3 个空格），转录按**每级
#     4 空格**重排（与 set-2 答案卷同口径）——只改缩进宽度，层级与字符不动；注释列对齐用的
#     填充空格按版面近似，不作为字符级证据。
#   · **表一律 GFM**：矩形数据表用 `| … |`，空单元格保留为空；表头取底本表头行（第 46 题
#     FIFO 表底本没有单独表头，取第一行 `页号` 作表头，已在该页条目里点名）。
#   · **图用本地相对链接**：答案卷的图（第 41 题染色示意图）裁到 `assets/q41-ans-fig.png`，
#     正文里以 `![…](assets/…)` 引用；裁切坐标记在第 6 页条目里。set-1/set-2 的答案卷没有
#     插图引用（那两卷解析里的图至今仍是空白），本卷起补上，不回填旧卷。
#
