# 逐页人工转录的来源登记（mock-2027/set-3 试题卷）
#
# 本卷与 set-2 同为**扫描件**，正文原本由 RapidOCR 识别，而实测识别结果不能当正文用
# （set-2 第 2 页 65 行里 40 余处字符错；本卷第 2 页的错同样密集：`字符串`→`字符申`、
# `maxFunc`→`maxPunc`、`栈`→`找`、`入度`→`人度`、`红黑树`→`红树`、`m^h-1`→`m-1`、
# 整段 C 代码粘成一行且 `return`→`toturn`）。判断依据与「提高 dpi 治不了」的对照实验
# 见 set-2 的 `pages.yml` 文首与 `load_page_overrides` 的 docstring，本卷不重复。
#
# 所以本卷正文也改为**人工逐页直读页图**，落在同目录 `pages/page-NNN.txt`，
# 由 `tools/md_from_pages.py` 的 `load_page_overrides` 取用。**全卷正文九页（第 2—10 页）
# 都已直读**；只有第 1 页封面（试卷标题页）仍走草稿，那里没有题目。
# 转录纪律见该函数 docstring：按印刷折行照抄、并排选项拆成一行一个、
# 图/表标注不抄进正文、看不清的字不猜（写在下面 source 里）。
#
# 每条都要写 source：**凭什么说这一页抄对了**（渲染图路径 + 倍率 + 该页要点）。
#
# 全卷统一口径（与 set-2 相同处从简，不同处写明）：
#   · **句末标点写作「。」**。底本句末印的是小实心点，不是空心圈句号；全套语料一律用
#     「。」，本卷跟着用（这是**归一化**，不是临摹，理由与实测见 set-2 的 pages.yml）。
#   · **公式里的括号一律写 ASCII**（`O(n)`、`(n-1)×(⌈m/2⌉-1)+1`），散文括号与分值写全角
#     `（）`——同为全套语料的归一化。
#   · **上下标：真指数/真下标用 `^{}` / `_{}` 标记，数组/序列下标按平面写法**。
#     与 set-2 的「一律平面」不同，理由是本卷**有真指数**：第 1 题选项 `O(2ⁿ)`、第 7 题
#     `mʰ-1`。平面写法会变成 `O(2n)`、`mh-1`，**改变题意**（`2n` 是 2×n）。而标记写法
#     在语料里有直接先例，且正是同一组选项：`papers/exams/2011`、`2012`、`2014` 三卷的
#     第 1 题选项即 `A. O(log_{2}n)` … `C. O(nlog_{2}n)` … `D. O(n^{2})`。
#     故本卷写 `O(log_{2}n)` / `O(nlog_{2}n)` / `O(2^{n})` / `m^{h}-1`。
#   · **子问题标记按全角 `（1）`**，依据与 set-2 的复核结论一致（见其 pages.yml 文首
#     「子问题标记形态」一节，不再重述）；本卷题目卷自第 7 页起出现该标记。
#   · **引号照抄 ASCII `"`**：第 3 题 `"aabaacaadaafa"` / `"aada"` 在 40—60 倍下是两点直竖、
#     无起收笔的弯曲，不是 `“”`；答案卷同一处也用 ASCII（`solution-pages` 里同）。

# ---------------------------------------------------------------------------
# 【本卷标点在扫描分辨率下的可辨性（第 2 页实测，后续各页沿用同一判据）】
#
# 这份扫描件的标点墨块只有 2—3 pt（逗号 `，` 与顿号 `、` 都退化成一团小墨），
# 100—200 倍放大也分不出「有尾/无尾」。实测两处对照：
#   · 已知顿号（第 2 页选项 `A. I、III、IV` 里 I 与 III 之间，x≈140.5、y≈241）：
#     200 倍 `z3p2dun200.png` 是一块约 2×2 像素的实心团，无尾。
#   · 已知逗号（第 1 题题干 `结点，下列` 的逗号，x≈263、y≈91）：
#     60 倍 `z3p2q1comma.png` 略见向下拖尾，但与小墨团只差 1 个像素。
# ⇒ **标点不能靠墨形定**：本卷一律按**语义 + 同页可对照的用法**取，且逐处点名。
#   这不是「猜字」——每个标点的取舍都在下面 source 里列出，可复核、可推翻。
# ---------------------------------------------------------------------------

- page: 2
  source: "6 倍渲染 `build/_scratch/probe/p-s3-02a.png`（y40—420）/ `p-s3-02b.png`（y400—800）直读第 01—08 题；细部另用 9 倍带刻度横带 `z3p2map200.png`（y196—250）/ `z3p2map300.png`（y296—360）定位行界，再按行定点放大：代码块 18 倍 `z3p2codeL.png` / 22 倍 `z3p2codeR.png` / 28 倍 `z3p2code1.png` / 40 倍 `z3p2code4.png`，第 3 题字符串 40 倍 `z3p2q3str3.png` 与 60 倍 `z3p2q3tail.png`，第 7 题公式 22 倍 `z3p2q7a.png` 与 50 倍 `z3p2q7br.png`，第 8 题选项 30 倍 `z3p2q8c.png`。**代码块**：底本印刷是 4 行（`int maxFunc(TreeNode* root) {` / `    if (root == NULL) return 0;` / `    return max(maxFunc(root -> left), maxFunc(root -> right)) + 1;` / `}`），逐行墨迹包围盒实测 x = 140.5—279.75 / 155.25—284.5 / 155.5—461.0 / 141.25—142.0（4 倍位图，脚本见本文件末尾「量法」），即整块比正文左边距（x=106.5）缩进约 34pt、内层再缩 14.75pt（≈3 个字符宽，字符步进 ≈4.9pt）。转录按标准 C 缩进（外层归零、内层 4 空格）——这是**版式归一化**，不是照抄缩进像素；`{`、`}` 的位置、`NULL` 的全大写、`root -> left` 两侧的空格、行尾 `;` 均按 18—40 倍图逐字确认（OCR 草稿把整块粘成一行且 `int`→`inc`、`maxFunc`→`maxPunc`、`return`→`toturn`、`==`→`，`、`;`→`:`）。**第 3 题的字符串**是 `\"aabaacaadaafa\"`（13 个字母，OCR 读成 `aabaacaadanfa`，多了一个 n）：40 倍下 `d` 之后是 `a a f a`，没有 `n` 的高竖笔；并用**答案卷的逐次比较**做交叉印证——解析写明第 1 次在 `S[2]` 与 `P[2]` 失配（`S[2]` 是 `b`≠`d`）、第 2 次在 `S[5]` 与 `P[2]` 失配且在 `nextval` 回退后 `S[5]`≠`a`（`S[5]` 是 `c`）、最后从 `S[6]` 起四次匹配成功（`S[6..9]`=`aada`），与 `aabaacaadaafa` 的下标 2/5/6 全部吻合。**第 5 题两处「入度」**（选项 A、B，60 倍 `z3p2rudu.png`）：字形是「入」（左边一撇起笔高、右边一捺交于其上），且**语义可判**——解析给的是 D（即 A/B/C 都正确），若印成「人度」则 A、B 两句话不成词；OCR 的 `人度` 是全库已知的形近误识。**第 7 题 A 的指数**：`m` 后紧跟一个抬高的小 `h`（22 倍 `z3p2q7a.png`，h 的基线比 m 高约 2.5pt）⇒ `m^{h}`；C 的括号是**上取整** ⌈m/2⌉：50 倍 `z3p2q7br.png` 量得左括号为「竖+顶端向右横」（无底横）、右括号为「竖+顶端向左横」（无底横），即 ⌈ ⌉ 而非 [ ]。**第 8 题 C 项是「红黑树」**（30 倍 `z3p2q8c.png` 见 `黑树` 两字，OCR 漏了 `黑`）。其余 OCR 误识已按放大结果改回：`字符申`→`字符串`、`栈`→`栈`（草稿读成 `找`）、`错误`（草稿读成 `误`，漏 `错`）、`层序迎历`→`层序遍历`、`使用权`→`使用栈`、`祖先`（草稿 `祖完`）、`人度`→`入度`、`红黑树`、`主对角线`（草稿同）、`拓扑排序序列`、`关键路径`（草稿 `关链路径`）、`双亲`（草稿同）。**标点**：第 1 题 `结点，下列`、第 4 题 `一棵树，则具有`、第 5 题 `陈述中，错误的是`、第 7 题 `相同，B树`、第 8 题 `数据结构中，从根结点` 取逗号；第 2 题选项 `I、III、IV` 等取顿号（理由与实测见文首「标点在扫描分辨率下的可辨性」）。**第 6 题的 AOE 网不进正文**（本页 y419—524 整块是图，见 `figures.yml` 的 q6 条；OCR 草稿第 39—49 行那些 `a4=3`/`85 2`/`ag=2` 散字即图内标注，不抄）。量法：`python -I -c \"import pymupdf; …\"` 以 4 倍灰度位图对指定 y 区间取墨迹包围盒（本页各带数字均由此得，未用肉眼估坐标）"

- page: 3
  source: "6 倍渲染 `build/_scratch/probe/p-s3-03a.png`（y36—400）/ `p-s3-03b.png`（y390—770）直读第 09—17 题。`page_bands.py` 量得 42 条墨迹带，行界与题号一一对应：带 #1—#3 = 第 9 题（题干两行 + 选项一行）、#4—#9 = 第 10 题、#10—#14 = 第 11 题、#15—#17 = 第 12 题、#18—#21 = 第 13 题、#22—#26 = 第 14 题、#27—#30 = 第 15 题、#31—#36 = 第 16 题、#37—#39 = 第 17 题。细部定点放大：第 9 题 12 倍 `z3p3q9.png` / `z3p3q9opt.png`；第 10 题 B 行 12 倍 `z3p3q10b.png`、C 行 14 倍 `z3p3q10c.png`；第 11 题左右半 20 倍 `z3p3q11L.png` / `z3p3q11R.png`，数组 30 倍 `z3p3arr.png`；第 12 题句尾 40 倍 `z3p3q12tail.png`；第 13 题 12 倍 `z3p3q13.png`；第 14 题选项 14 倍 `z3p3q14opt.png`、float 40 倍 `z3p3q14float.png`；第 15 题 128KB 40 倍 `z3p3q15kb.png`；第 16 题选项 14 倍 `z3p3q16opt.png`，分隔符另取 80 倍单符 `z3p3sepa2.png`（A）/ `z3p3sepb4.png`（B）/ `z3p3sepd4.png`（D）。本页**无插图**（42 条带里没有高带），figures.yml 不登记。**上下标**：`2^{17}`——第 13 题 40 倍下指数 17 的基线比 `2` 高约 2.5pt 且字号小，是真指数（OCR 草稿写成 `217`，会把 2¹⁷ 读成 217，改变题意）；`M_{1}`/`M_{2}`——第 12 题句尾 40 倍 `z3p3q12tail.png` 里 M 后的 2 明显下沉、字号小，是真下标，按本卷口径写 `_{}`（语料先例 exams/2011 的 `M_{4}M_{3}M_{2}M_{1}M_{0}`；同句 2017 用平面 M1/M2，两种都有先例，本卷取标记式以与自己的 `log_{2}n` 一致）。**十六进制里的空格照抄**：`FFFF C000H` / `FFFF C002H`（12 倍图可见 4 位与后 4 位之间的空隙），第 14 题四个选项 `C000 1100H` / `C000 1403H` / `C000 118FH` / `C000 1193H` 同样——14 倍 `z3p3q14opt.png` 四个选项**都有**这个空格，而 OCR 草稿只给出了 A/B 两处、C/D 漏掉，说明该空格是印刷的、不是 OCR 噪声。**第 16 题四个选项的分隔符**：80 倍下 A、B、D 三处的墨形**完全一致**（都是带上翘小尾的逗点，基线位置、大小相同），OCR 草稿却把 B/D 读成「、」；既然墨形分不出「，」与「、」，按语义（两个十六进制数并列）四处统一取「，」。**第 11 题数组分隔符**同理：30 倍 `z3p3arr.png` 与 20 倍 `z3p3q11R.png` 下逗点与句点不可分，按语义（数字序列）取 ASCII 逗号并保留印刷的逗号后空格：`[4, 7, 8, 3, 5, 6, 10, 9, 1, 2]`。**第 11 题的斜杠**：`最大值/最小值`、`最右端/最左端` 在 20 倍下是一条实斜线，取 `/`，不是顿号。**第 10 题「（或最小）」**：14 倍下「或」后是一个密排字形（最）+ 小；OCR 在 C 行漏了「最」、在 B 行读成「品小」，按 B/C 同句与语义补回。**第 9 题选项**：印刷在 k、−、1 之间有排版间隙，按语料与第 2 页 `n-2` 的紧凑口径归一化为 `k-1次` / `k+1次` / `k(k+1)/2次`（运算符两侧不留空格）。**负号**：第 13 题 `(-4.25)` 按 ASCII `-`（语料公式口径）。**全角括号**：`（ISA）`、`（Write Back）`、`（MSB）`，语料先例 exams/2015、2017、2024 同句写法。**OCR 误识已按放大结果改回**：`关健字`→`关键字`、`丘为同义同`→`互为同义词`、`川`→`用`、`探调法`→`探测法`、`存人`→`存入`、`微列表`→`散列表`、`婴`→`要`、`效据`→`数据`、`致大`→`最大`、`品小`→`最小`、`紫引块`→`索引块`、`每一题`→`每一趟`、`最大储最小值`→`最大值/最小值`、`最右袋`→`最右端`、`下一缩小范困`→`下一趟缩小范围`、`M，`→`M_{1}`、`800MIHz`→`800MHz`、`主领`→`主频`、`洛式`→`格式`、`Boat`→`float`、`元紫`→`元素`、`12SKB`→`128KB`、`204SK`→`2048K`。**标点**逐处：第 9 题「同义词，若用」「散列表中，至少」；第 10 题「分块查找时，」「若干块，」「不必有序，但块间必须有序，」；第 11 题「冒泡排序，其」「如下：」「方法，」「最小值，并」「最右端。第一趟」「往右，」「最左端；」「此过程，」「为止。」；第 12 题「（ISA），」「800MHz，」「8s，」「1.5 倍，」；第 13 题「编址，」「数据，」「表示的数，」「2^{17}，」「单元中，」；第 14 题「存储，」「编址。」「元素，」「float，」「区域中，」；第 15 题「32 位，」「编址，」「方式，」「1 个字，」「32 位，」「策略，」；第 16 题「指令，」「特征，」「4000H。」「2000H，」「0100H，」「1234H，」「编址，」「增长，」「数据。」；第 17 题「指令、微指令和微程序」取顿号（并列词）。页眉「27考研408模拟卷3·试题」与页脚「第3页／共10页」属版式、不转录"

- page: 4
  source: "4 倍整页两半 `build/_scratch/probe/z3p4top.png`（y20—420）/ `z3p4bot.png`（y415—770）直读第 18—25 题；`page_bands.py` 量得 36 条墨迹带，行界与题号一一对应：带 #1 = 第 18 题题干、#2 = `I.`+`II.`（并排两列）、#3 = `III.`+`IV.`、#4 = 选项一行四列、#5—#9 = 第 19 题（题干 + A—D）、#10—#12 = 第 20 题题干三行、#13—#15 = 第 20 题代码三行（字高 6pt，比正文小一档）、#16 = 第 20 题选项一行四列、#17—#18 = 第 21 题（题干 + 一行四列选项）、#19—#22 = 第 22 题（题干两行 + 两行选项）、#23—#27 = 第 23 题（题干 + 四项各占一行）、#28（24pt，题干与 `I.`/`II.` 行在墨迹上粘连）= 第 24 题、#29 = `III.`/`IV.` 行、#30 = 选项一行四列、#31 = 第 25 题题干、#32 = `int turn = 1;`、#33（60pt）= 第 25 题代码框、#34 = 两个右花括号（x142 与 x308 各 2px 宽，正是代码框两列的 `}`）、#35 = 页脚。**本页无插图**：唯一的高带 #33 已由 #34 的双 `}` 与 8 倍渲染 `z3p4q25blk.png` 证实是代码框（两列函数体），figures.yml 不登记。**版式归一化（并排拆行）**：底本把同一题的多项排成一行或两列（第 18 题 `I. 指令译码器　II. 通用寄存器`、`III.状态寄存器　IV.ALU`；第 21、22、24 题的选项一行四列或两列两行），转录一律拆成**一项一行**——与第 2 页、set-2 及语料全库一致，便于编辑；拆行只动版式，不动字。第 18 题底本 `III.状态寄存器`、`IV.ALU` 句点后**无空格**，按同页 `I. ` / `II. ` 与第 2 页 `I. 树…` 统一补一个空格。**第 21 题 B 项底本漏印句点**（`B 访问 Cache 缺失`，4 倍与 10 倍下 B 后确无点），按 A/C/D 归一化为 `B.`。**第 20 题代码块**（8 倍 `z3p4q20blk.png` 与 4 倍整页直读）：底本是一个浅灰底三行框，左边是指令列、右边是结果列（用空白对齐、无 `//` 之类的注释符），转录保留两列空白对齐但不加注释符，指令与结果按印刷间距排：`I1  addi R1,30` / `(R1) ← 30`，`I2  lw   R2,R0,16` / `(R2) ← M((R0)+16)`，`I3  add   R3,R1,R2` / `(R3) ← (R1)+(R2)`；箭头是印刷的 `←`（不是 `→`、也不是 `=`）；OCR 草稿把这三行毁成 `L1addi Rl,30` / `131×52.30.16` / `I3 ad R,1.2`，右侧读成 `(I）-30` / `(R2）-N((R0)-16)`，其中 `I2` 的中段操作数在低分辨率下与 `80`/`50` 形近，按 180dpi 原始像素（JPEG xref 18，1488×2103）裁切放大直读，确认首字母是 `R`、该操作数是 `R0`，与右列 `M((R0)+16)` 自洽。**第 20 题「译码/取数」**：18 倍 `z3p4q20word.png` 下斜杠后的字左为「耳」右为「又」，是「取」不是「收」（OCR 读成 `收数`）；同一句里「取指」「/」也一并确认，故写 `取指、译码/取数、执行、访存、写回`。**第 20 题引号**：采用\"取指…写回\"这种、不采用\"转发\"技术——18 倍 `z3p4q20stem.png` 下是两点直竖、无起收笔弯曲，按本卷口径写 ASCII `\"`（与第 3 题字符串同判据）。**第 25 题代码块**：底本两列并排（左 Thread1、右 Thread2），逐行对应：`int turn = 1;` 独占一行，`void Thread1() {`↔`void Thread2() {`，`// 其他操作...`↔同，`while (turn != 1);`↔`while (turn != 2);`，`// 操作打印机`↔同，`turn = 2;`↔`turn = 1;`，`// 其他操作...`↔同，`}`↔`}`；转录按**列**串成两段函数（先 Thread1 再 Thread2）并保留标准 C 缩进与 `//` 后一个空格，8 倍 `z3p4q25blk.png` 逐字核对。**第 25 题 turn/curn 的存疑处**：`while (turn != 1)` 的 `t` 有上伸笔、`int turn = 1;` 的 `turn` 清楚，但两条赋值行 `turn = 2;` / `turn = 1;` 的字首在小字号下与 `c` 形近（OCR 即读成 `int curn=1;` / `curn=2:`）；本转录按声明与 while 行统一取 `turn`，**留待原卷复核**——此处不是补字，而是同页同变量的三处互证（声明、判等、赋值）取多数。**标点**逐处：第 18 题「数据通路中，包含」；第 19 题「叙述中，错误的是」、A「信息」（句末无标点，同印刷）、B「信号需通过」、C「之间」、D「指令访问」；第 20 题「序列中，发生了数据相关。」「5 段流水线方式，」「技术，」「加入（ ）」「空白操作（nop）指令才能」「数据冒险：」——句末用冒号引出代码，**不是句号**；第 21 题「事件中，」；第 22 题「打印控制时，」「以下的」；第 23 题「说法中，」与四项句末「。」；第 24 题「操作中，」，`I.`「main 函数执行 return 0;」保留印刷的分号；第 25 题「共享，」「问题是」。**空格**：`5 段`、`第 3 条`、`CPU 时间`、`Cache 缺失`、`其他操作` 均按印刷留空格；第 24 题 `I.` 项印刷作 `C语言程序`（拉丁 C 紧贴汉字），按语料先例 exams/2009 等的 `C 语言程序` 补一个空格——这是**间距归一化**，与本卷第 2 页同口径。页眉「27考研408模拟卷3·试题」与页脚「第4页／共10页」属版式、不转录；第 24 题题干左侧（x≈95、y≈470）有一条短横状扫描折痕，非文字，不转录。**第 20 题题干的折行位置**：底本第 1 行正好折在 `5` 与 `段` 之间，而 `join_lines` 只给「ASCII 字母数字 ↔ ASCII 字母数字/`(`」补空格，CJK 一侧不补，所以合并后是 `这种 5段流水线方式`（`5` 前的空格是印刷的、留住了；`5` 与 `段` 之间那条缝是折行，不是空格）。不为此挪动折行位置——语料里 `5段` 有先例（mock-2027/set-1 即 `5段流水线`），`5 段` 也有先例（exams/2019、2023、2024），两种并存，本页照折行结果"

- page: 5
  source: "4 倍整页两半 `build/_scratch/probe/z3p5top.png`（y20—300）/ `z3p5bot.png`（y295—660）直读第 25 题选项与第 26—33 题；定点放大 7 倍 `z3p5mid.png`（y240—320，第 26 题选项与第 27 题题干）、8 倍 `z3p5q28.png`（y350—400，第 28 题与第 29 题首行）、7 倍 `z3p5q2930.png`（y395—520，第 29、30 题与第 31 题首行）、7 倍 `z3p5tail.png`（y515—660，第 31 题选项到第 33 题题干）。`page_bands.py` 量得 31 条墨迹带；**页内没有插图**——偏高的四条带都不是图：#7（y143—221，78pt、x249—337 的窄带）是第 26 题的段表，#10（41pt）、#13（39pt）、#25（27pt）都是行距压得紧、被并成一条的整块正文（对照 4 倍整页：第 26 题选项两行 + 第 27 题题干首行、第 28 题与第 29 题首行、第 31 题选项 + 第 32 题题干），figures.yml 不登记。**第 26 题的段表按 GFM 表转录**（底本是一张两列四行的框线表：表头「段寄存器 / 段基址」，行 CS 0x00000、DS 0x07C00、SS 0x65000、ES 0xB8000），写法与 set-2 第 3 页第 12 题、第 5 页资源分配表一致（表前表后各空一行）；OCR 把表头读成 `是址`、把 `0x65000` 读成 `00059x0`、把 `0x07C00` 读成 `Dx07C00`，均按 4 倍页图改正。**第 25 题的 A 项**：本页首行就是选项 A，底本印刷为 `A.`（衬线斜体 A），草稿读成 `入.`——这一页转人工直读后，`recovered-lines.yml` 里对应第 25 题的那条 `opt_mark` 已删（该文件顶部的说明也一并改写）。**第 26 题选项的分隔符**：7 倍 `z3p5mid.png` 下 A、C 两处是带尾的逗点，B、D 两处是基线小方点（草稿据此读成 `.`），墨形确有差别但语义相同（两个十六进制地址并列），四处统一取 `，` 并保留印刷的逗点后空格：`0x01327， 0xB9592`。**第 27 题的数值**：7 倍下依次是 `1μs`（草稿 `1us`）、`1ms`、`10ms`、`60%`、`3μs`；`μ` 是带下伸尾的希腊字母，不是拉丁 `u`。**第 29、30 题的选项分隔符**同样是混印：7 倍 `z3p5q2930.png` 下第 29 题 A、B 是逗点、C、D 是方点，第 30 题 A、B 是逗点、C、D 是方点——按语义统一取 `，`，逗点后照抄一个空格（`A. 0， 1` / `A. 22， 142`）。**第 31 题的 100ns**：草稿读成 `100ms`，7 倍下单位与同句 `5ns`、`90ns` 同一字形，是 `ns`。**第 30 题题干里的顿号**：`位示图行和列、盘块号` 中间是顿号（并列词），同句的 `情况，`、`编号，` 是逗号。**第 32 题的间距**：`DMA 是一种…`、`DMA 整个…`、`DMA 进行…`、`DMA 的使用…` 四处拉丁缩写后都留空格。**第 33 题的选项在第 6 页**：本页只到题干，转录到此为止。**OCR 误识已按放大结果改回**：`段农`→`段表`、`将存器`→`寄存器`、`0xi592`→`0x1592`、`装人`→`装入`、`宇节`→`字节`、`级冲区`→`缓冲区`、`100ms`→`100ns`、`采处理`→`来处理`、`帮助`→`协助`、`线帮`→`线程`、`邢`→`都`、`销误`→`错误`、`线型！`→`线程 1`、`线壁`→`线程`。**标点**逐处：第 25 题「打印机，发生」「打印机，打印」「打印机，转而」「操作，则」；第 26 题「内存，」「寄存器中，」「段基址，」「不存储段长。」；第 27 题「1μs。」「中断时，」「修改，」「10ms。」「修改过，」「3μs，」；第 28 题「地址的过程称为」；第 29 题「12 个，」「各一个。」「4KB，」「4B。」「内存中，」「字节和」「字节时，」；第 30 题「情况，」「始编号，」「（ ）行，」「（ ）列。」；第 31 题「磁盘数据，」「5ns，」「90ns，」；第 32 题四项句末「。」。页眉「27考研408模拟卷3·试题」与页脚「第5页／共10页」属版式、不转录。**第 28 题题干行首与第 32 题题干行首前各有一道手绘短斜线**（底本上页边的手写标记，x≈100 处），非文字，不转录"

- page: 6
  source: "4 倍整页两半 `build/_scratch/probe/z3p6top.png`（y20—300）/ `z3p6bot.png`（y295—660）直读第 33 题剩余项、第 34—38 题；插图另用 5 倍 `z3p6q38fig.png`（x105—490、y495—620）。`page_bands.py` 量得 34 条墨迹带，本页**只有一处插图**：带 #30 = y505—602（97pt、x121—472），是第 38 题的拓扑图，已登记进 `figures.yml`（q38）并由 `crop_figures.py` 裁出 `assets/q38-fig.png`；其余偏高带为 0，行带与题号一一对应（#1 = 第 33 题 I 项、#2—#3 = II 项两行、#4 = III 项、#5 = 选项行、#6 = 第 34 题题干、#7—#10 = 第 34 题四个选项、#11—#14 = 第 35 题题干四行、#15 = 第 35 题选项行……#29 = 第 38 题题干末行、#31—#32 = 第 38 题选项两行）。**第 33 题**：三项在底本上是 `I.` / `II.` / `III.` 三条，II 项折行（`…表示层、应` / `用层`），转录照折行写、合并后成一句；三个罗马序号底本用衬线大写 I，按同页语料口径写 `I.` / `II.` / `III.`；选项 `D.` 是三项全选（`I、II、III`）。**第 34 题**：题干「奈奎斯特定理和香农定理…错误的是」；四选项里的关键词 OCR 全毁（`奈全斯持定班`→`奈奎斯特定理`、`这用于`→`适用于`、`尤噪应`→`无噪声`、`借议`→`错误`、`因紫`→`因素`、`带究`→`带宽`），已按 4 倍页图逐字改回；A 项的「无噪声理想低通环境」与 D 项的「码元波形种类」在 4 倍下清晰可读。**第 35 题**：“忽略所有的传播时延”的「忽」字被草稿读成「路」（`路所有的传插时延`），页图上是「忽略」；`t` 是两个独立变量（`花费了 t 秒。在 t 秒内`），底本用斜体拉丁 t，此处照写 ASCII `t`；`10kbps`、`10kb`、`20kb` 三处单位与页图一致（草稿这几处也没错）。**第 38 题**：题干四行照折行抄；图内标注（192.168.101.1 / 192.168.100.1 / 192.168.101.2 / 192.168.100.2 与四条 MAC、接口名 E1/E2、设备名 S1/S2/R/H1/H2）**不抄进正文**，只在 `figures.yml` 的 source 里登记；四个选项的 MAC 串按页图逐字核对（`ff-ff-ff-ff-ff-ff`、`01-2a-3b-4c-5d-11`、`01-2a-3b-4c-5d-01`、`01-2a-3b-4c-5d-02`），选项内的分隔符是逗点加一个空格，四处一致。**OCR 误识已按放大结果改回**：`参号模显`→`参考模型`、`物理人`→`物理层`、`欲据链路层`→`数据链路层`、`应川层`→`应用层`、`参多筷型`→`参考模型`、`据份路层`→`数据链路层`、`台考模级`→`参考模型`、`长示层`→`表示层`、`会话展`→`会话层`、`数据顿`→`数据帧`、`检错笔码`→`检错编码`、`到错宝码`→`纠错编码`、`题机访问`→`随机访问`、`绥存`→`缓存`、`以太网顿`→`以太网帧`。**标点**逐处：第 33 题三项句末无标点（照印刷）；第 34 题「说法中，错误的是」「环境，」「速率」「环境中，」「环境中，」；第 35 题「连接，」「连接，」「10kbps。」「时延、」（顿号，并列三项）、「时间，」「报文，」「秒。」「秒内，」；第 36 题「方法后，」「编码，」「编码，」「10 位，」；第 37 题「说法中，」「有线网络，」「无线网络，」「确认，」「冲突时，」；第 38 题「所示，」「S1，」「S2。」「H2。」「MAC 地址如下图所示。」「缓存，」「分组，」「分别是」。页眉「27考研408模拟卷3·试题」与页脚「第6页／共10页」属版式、不转录"

- page: 7
  source: "4 倍整页两半 `build/_scratch/probe/z3p7top.png`（y20—310）/ `z3p7bot.png`（y300—770）直读第 39—43 题；定点放大 6 倍 `z3p7q39full.png`（第 39 题整题）、`z3p7q40.png`（第 40 题与栏目标题）、`z3p7q41stem.png` / `z3p7q41sub.png`（第 41 题题干与三问）、`z3p7q42struct.png` / `z3p7q42req.png`（第 42 题结构体与要求），8 倍 `z3p7q43code.png`（第 43 题程序段），插图另用 5 倍 `z3p7q41fig.png` 与 10 倍左右两半 `z3p7q41figL.png` / `z3p7q41figR.png`。`page_bands.py` 量得 36 条墨迹带：#1—#3 = 第 39 题题干三行、#4 = 第 39 题选项一行四列、#5—#6 = 第 40 题题干两行、#7 = 第 40 题选项一行四列、#8 = 栏目标题、#9—#10 = 第 41 题题干两行、#11（89pt、x156—436）= 第 41 题的两张无向图（本页唯一插图，已登记 `figures.yml` 的 q41，`crop_figures.py` 裁出 `assets/q41-fig.png`）、#12 = 「请回答下列问题：」、#13—#15 = 三问、#16—#17 = 第 42 题题干两行、#18—#21 = 结构体四行（字高 5—7pt，比正文小一档）、#22 = 「要求：」、#23—#25 = 三问、#26—#28 = 第 43 题题干三行、#29—#34 = 第 43 题程序段六行（#30、#34 的最长墨迹只有 1px 宽，正是 `{` 与 `}` 各自单独成行；#32 高 18pt，是 `for (...)` 与 `sum += ...` 两行并成一条带）、#35 = 页脚。**第 39 题**：`S 发送的一个 TCP 段为（ SYN = 1， ACK = 1， seq = 1000， nck = 2000 ）`，字段两侧印刷有空格、括号是全角 `（）`，逐一照抄；`FIN = 0` 也照抄（不是常见的 `FIN = 1`，6 倍下 `0` 闭合、与同句 `= 1` 的 `1` 字形不同）。**`nck` 是本页的存疑点，未按语义改写**：底本两处都印作 `nck`，14 倍 `z3p7seqfield.png` 与 18 倍 `z3p7nck1.png` 下首字是两根竖笔、顶上由一横拱相连（`n`），而同页域名里的 `a` 在 20 倍 `z3p7dom20.png` 下是双层碗形，两者不同；RapidOCR 草稿也读作 `nck`。TCP 语义上该字段应为 `ack`，答案卷第 5 页只讨论 SYN/FIN/ACK/seq、不重述该字段，无内部对照。故**照抄 `nck` 并在本行点名，留待原卷复核**——不擅自改成「看起来正确」的 `ack`。**折行处理（第 39、40 题各写成一行）**：第 39 题底本在第 1 行末折在 `seq =` 之后、第 2 行以 `1000` 起，`join_lines` 只在「ASCII 字母数字 ↔ ASCII 字母数字/`(`」之间补空格，`=` 收尾时合并会得到 `seq =1000`，把印刷的空格吃掉；第 40 题折点落在域名与 `时` 之间（拉丁↔汉字，`join_lines` 同样不补空格）。这两题因此**各写一行**，只动折行位置、字符与空格一字未改——与第 4 页 `5段` 那处「不挪折行」的处理是同一类版式取舍，两处都记在此处备查。**第 39 题选项**：底本 A—D 排成一行四列，按本卷口径拆成一行一个；A 行在本页草稿里被整个毁成 `866V`，本页转人工直读后 `recovered-lines.yml` 里第 39 题的 `replace` 条目已删。**第 40 题**：域名 20 倍 `z3p7dom20.png` 逐字确认 `www.aaa.bbb.com`（三个 `a` 都是双层碗、与 `bbb` 的 `b` 不同；草稿读成 `www.短a.bbb.com`）；选项分隔符 14 倍 `z3p7q40opt.png` 下四处是同一种逗点，语义为两个次数并列，取 `，`，且底本逗点后**没有**空格，故作 `0，1` / `0，4` / `1，1` / `1，4`（与第 26、29、30 题逗点后带空格不同，逐处照印刷）；折点处的 `com 时` 按语料口径补一个空格（`questions.md` 里「拉丁+空格+时/中/当/期」共 258 处、无空格 56 处，与第 4 页 `C语言程序`→`C 语言程序` 同一口径）。**栏目标题**：底本印 `二、综合应用题：41 ～ 47 小题，共 70 分。`，照抄进页文件；输出里的 `## 二、综合应用题（41—47 题，共 70 分）` 是 `md_from_pages.py` 在选择题与综合题之间**自动生成**的（该脚本第 1440 行），不从页文件取，`RE_SECTION` 会把本行从题干流里剔掉。**第 41 题**：分值写作 `（8分）`——底本印 `(8分)`（数字与「分」之间无空格），本卷与 set-2 同口径只把括号归一成全角、不加空格（set-2 第 7 页作 `（13分）`；真题卷的 `（8 分）` 是另一套排版，不套用）；三个子问按全角 `（1）（2）（3）`（与 set-2 一致）；题干与「请回答下列问题：」在页文件里**之间留一空行**（底本这句单独起行、与题干之间行距明显加大），否则两句会被并成一段；图内**没有任何标注**（顶点无标号），正文不引任何顶点名。**第 42 题**：结构体按 fenced code 转录，四行照印刷——`struct Node {`、4 空格 `int data;`、4 空格 `Node *left, *right, *parent;`、`};`；底本整块有浅灰底框、且比正文缩进约 20pt，转录按标准 C 缩进（与第 2 页代码块同一口径）。草稿把结构体毁成 `struct Node`（丢了 `{`）/ `Node*left.\"righc.\"parent;`（星号、逗号全错），8 倍逐字改回。**第 43 题**：题干三行照折行抄；`1MB`、`32B`、`16B`、`Cache` 与汉字之间的空格照印刷；程序段按 fenced code 六行——`float f(float x[8], float y[8])` / `{`（底本 `{` 单独成行、顶格）/ 4 空格 `float sum = 0.0;` / 4 空格 `for (int i = 0; i < 8; i++)` / 8 空格 `sum += x[i] * y[i];` / 4 空格 `return sum;` / `}`，8 倍 `z3p7q43code.png` 逐字核对。**本页只到程序段的 `}`**：题干续行（「程序运行时，编译器将变量 sum 和 i 分配在寄存器中…」）与四问都在第 8 页，本页不抄。**OCR 误识已按放大结果改回**：`主机H和I服务器`→`主机 H 和服务器`、`处立`→`建立`、`发逸`→`发送`、`格欣连接利`→`释放连接时`、`HI发送`→`H 发送`、`应川层狄据`→`应用层数据`、`字节狄`→`字节数`、`序`（`Seq`）→`seq`、`域名套询`→`域名查询`、`成名服务器`→`域名服务器`、`政乡次数`→`最多次数`、`向题`→`问题`、`色`→`颜色`（草稿漏「颜」）、`注`→`注释`（草稿漏「释」）、`映时`→`映射`、`loaty`→`float y`、`i*`→`i++`、`x(i]*y[il:`→`x[i] * y[i];`。**标点**逐处：第 39 题「TCP 连接时，」「2000 ），当释放连接时，」「5001，」「字节数为」；第 40 题「域名查询，」「最多次数为」；第 41 题「无向连通图，」「红色或蓝色。」「都不相同，」「能被二分。」「下列问题：」「标出每个顶点的颜色。」「思想即可。」「空间复杂度。」；第 42 题「存储结构，」「如下，」「要求：」「设计思想。」「给出注释。」「时间复杂度。」；第 43 题「1MB，」「按字节编址，」「映射方式，」「数据区容量为 32B，」「大小为 16B，」「和直写法。」「程序段：」。页眉「27考研408模拟卷3·试题」与页脚「第7页／共10页」属版式、不转录"

- page: 8
  source: "4 倍整页两半 `build/_scratch/probe/z3p8top.png`（y20—400）/ `z3p8bot.png`（y390—770）直读第 43 题续文、第 44 题题干与三张表；定点放大 6 倍 `z3p8q43tail.png`（第 43 题续文两行与 `请回答下列问题：`）、`z3p8q43q234.png`（第 43 题第 2—4 问）、`z3p8q44stem2.png`（第 44 题题干四行）、7 倍 `z3p8q44q1.png`（第 44 题第 1 问），三张表各用 8—9 倍两半逐格核对：`z3p8tlbL.png` / `z3p8tlbR.png`（(a) TLB 表）、`z3p8tabb1.png` / `z3p8tabb2.png`（(b) 部分页表）、`z3p8tabc1.png` / `z3p8tabc2.png`（(c) data Cache 表）；分隔符另取 15—16 倍单处 `z3p8sepA.png`（`128B、TLB`）、`z3p8sepB2.png`（`运行时，数据访问`）。`page_bands.py` 量得 23 条墨迹带：#1—#2 = 第 43 题续文两行、#3 = `请回答下列问题：`、#4—#5 = 第 43 题第 1 问两行、#6 = 第 2 问、#7—#8 = 第 3 问两行、#9—#10 = 第 4 问两行、#11—#14 = 第 44 题题干四行、#15（67pt）= (a) TLB 表（自身含表头行，与题干末行不相碰）、#16 = (a) 的题注、#17 = (b)/(c) 两表的表头行（并排，故合并成一条带）、#18（231pt）= (b)、(c) 两张表的表体（并排 16 行，故成一条高带，其底部还裹着两行题注）、#19 = `请回答下列问题：`、#20—#21 = 第 44 题第 1 问两行、#22 = 页脚。**本页三张表都是数据表，不是插图**，故 **不登记 figures.yml**，按 GFM 表逐格转录（表前表后各空一行，与第 5 页第 26 题的段表、set-2 第 3/5 页的表同一写法）。**并排表线性化**：(b) 与 (c) 在底本上是左右并排的两张表（(b) 在左、(c) 在右，共用一个表头行区），转录按 **(a) → (b) → (c)** 顺序串成三张表，各表题注紧跟在本表之后（底本题注本来就印在表体下方）；只动版式、不动数据。**三张表的数据逐格照抄**，空格一格不填、`-` 照印：(a) 为 `组号 | 标记 页框号 有效位 ×4`（13 列、4 行；底本表头把「标记 页框号 有效位」重复了四遍，对应 4 路）；(b) 为 `虚页号 | 页框号 | 有效位`（16 行，虚页号 000—00F）；(c) 为 `行索引 | 标记 | 有效位 | 字节3 | 字节2 | 字节1 | 字节0`（16 行，行索引 0—F）。三张表的首列（组号 / 虚页号 / 行索引）在底本上都印在表格框线**外侧**，转录时并入表格作第一列。**第 43 题续文**：`程序运行时，编译器将变量 sum 和 i 分配在寄存器中，数组 x 存放在 00040H 开始的连续存储区中，数组 y 则紧跟在 x 后进行存放。`——`00040H` 是十六进制主存地址（草稿同），程序段本身在第 7 页、本页只有这段说明与四问；四问的折行都在汉字之间（`连续存储区/中`、`Cache 的/总容量`、`则数/据访问`、`数据访问/的 Cache`），`join_lines` 合并安全，故照折行抄。**第 44 题题干**：`页大小为 128B、TLB 为 4 路组相联共有 16 个页表项` 中间是**顿号**——16 倍 `z3p8sepA.png` 下该墨块是一道斜撇（顿号），与同句逗点的下垂小尾不同形；`虚拟地址 16 位，物理地址 12 位；页大小为 128B、…；数据 Cache 采用直接映射方式，块大小为 4B，共 16 行。` 三个分号/逗号逐处按墨形与语义取。**第 43 题第 3 问**的 `运行时，数据访问的命中率是多少？` 中间是**逗号**：15 倍 `z3p8sepB2.png` 下该墨块带下垂小尾（顿号是斜撇），且此处并列的不是词而是两个分句。**OCR 误识已按放大结果改回**：`中.数组`→`中，数组`、`宇段`→`字段`、`Cachc`→`Cache`、`foal[12]`→`float[12]`、`命中辛`→`命中率`、`SB`→`8B`、`12SB`→`128B`、`虚拟（逻辑）`（草稿同）、`(1）`/`(2）` 括号半边全角半边 ASCII → 统一全角。**标点**逐处：第 43 题续文「运行时，」「寄存器中，」「连续存储区中，」「存放。」；第 43 题四问「如何划分？」「位置。」「多少位？」「局部性？」「为什么？」「运行时，」「多少？」「float[12]，」「多少？」「映射方式，」「8B，」「不变，」「多少？」；第 44 题「Cache。」「编址，」「16 位，」「12 位；」「128B、」「页表项；」「映射方式，」「4B，」「16 行。」「某一时刻时，」「部分内容」「如下图所示。」；三张题注与第 44 题第 1 问「多少？」「比较器？」「多少？」。页眉「27考研408模拟卷3·试题」与页脚「第8页／共10页」属版式、不转录"

