  source: "4 倍整页两半 `build/_scratch/probe/z3p9top.png`（y20—300）/ `z3p9bot.png`（y390—770）直读第 44 题第 2—4 问、第 45 题全题与第 46 题题干；定点放大：第 44 题第 2—4 问 6 倍 `z3p9q44tail.png`，第 45 题题干 4 倍 `z3p9q45stem.png`、第 45 题三问与第 46 题题干 4 倍 `z3p9q45sub.png`，页底第 46 题第 1 问 4 倍 `z3p9bottom.png`，分值标记 10 倍 `z3p9score.png`；标点另做**逐列墨迹量距**：第 45 题第 2 问的顿号 10 倍 `z3p9q45sep.png`、第 46 题题干的顿号 10 倍 `z3p9q46sep.png`、第 44 题第 2 问与第 4 问的问号 10 倍 `z3p9qm2.png` / `z3p9qm4b.png`。`page_bands.py` 量得 23 条墨迹带：#0 = 页眉、#1—#2 = 第 44 题第 2 问两行、#3 = 第 3 问、#4—#5 = 第 4 问两行、#6—#9 = 第 45 题题干四行、#10（180pt、x135—451）= 第 45 题的索引节点结构图（本页第一处插图，已登记 `figures.yml` 的 q45，`crop_figures.py` 裁出 `assets/q45-fig.png`，644×376）、#11 = `请回答下列问题：`、#12—#14 = 第 45 题三问、#15—#18 = 第 46 题题干四行、#19（117pt、x193—392）= 第 46 题的位示图（本页第二处插图，已登记 `figures.yml` 的 q46，裁出 `assets/q46-fig.png`，410×248）、#20 = `请回答下列问题：`、#21 = 第 46 题第 1 问首行、#22 = 页脚（页眉 `27考研408模拟卷3·试题` 与页脚 `第9页／共10页` 属版式，不转录）。**两张插图都做过直读验收**：`q45-fig.png` 里 13 个地址项 `i.addr(0)`—`i.addr(12)` 与右侧三个索引块完整、无正文行裹入；`q46-fig.png` 是 16×7 的位示图外加两行省略表示（`1` + 点线、纯点线），完整、无正文行裹入——该图**保留为插图、不转 GFM**（见 `figures.yml` 的 q46 条：GFM 没有跨列，硬转会丢掉省略语义），因此 OCR 草稿第 80—82 行那三个孤零零的 `0` / `D` / `D` 是它对省略行的误读，**不进正文**。**第 44 题第 2、3 问**：第 2 问折在 `哪几个` / `字段` 之间（汉字↔汉字，`join_lines` 不补空格，合并安全）；第 3 问底本一行到底。**第 44 题第 4 问**：折在 `0353H` / `会产生` 之间（拉丁↔汉字），合并后是 `0353H会产生异常还是中断`，中间没有空格——这是折行，不是漏空格，与第 4 页 `5段` 的处理同类。**问号的归一化（本页第一次集中出现，逐处点名）**：底本印的是**半角窄形问号**，墨宽只有 2pt（10 倍 `z3p9qm2.png` 逐列墨迹量得：`物理页号` 后一处为「前距 1.7pt + 墨宽 2.0pt + 后距 6.5pt」，三段相加 10.2pt ≈ 一个整字步进 9.6—9.8pt，即**整字宽的空位**而非另打一个空格；同一个墨形在 `z3p9qm4b.png` 里却与后一字相贴）。全库口径统一写**全角 `？`、其后不加空格**（set-2 与真题卷同），本页四处：第 2 问 `物理页号？使用物理地址…`、`哪几个字段？要求…`，第 3 问 `为多少？说明…`，第 4 问 `在主存中？访问…`、`软件处理？访问地址…`；句末同样处理：第 45 题 `表达式即可。`、`偏移量。`、`几次磁盘？`，第 46 题 `已分配）。`、`2489。`。**顿号后不加空格**：第 45 题第 2 问 `9999、18000、420000` 与第 46 题题干 `726、937、1242、5190、235、5000、/ 2896、3724、4231、2489` 两处都量过——顿号墨宽 2.4—2.8pt、前距 1.7—2.1pt、后距 5.7—7.3pt，合计仍是一个整字步进（同一字宽下汉字 8.4—9.2pt、数字字身 4.0—4.8pt、步进 4.9pt），说明后距是**全角顿号字框的空白**，本卷不另补空格（与第 3 页 `I、III、IV` 一致）。**分值标记**：底本印 `45.（7分）` / `46.（8分）`，照本卷与 set-2 的口径只把括号归一成全角、数字与「分」之间不加空格（10 倍 `z3p9score.png` 可见 `（7分）` 三字撑满一个全角框，`7` 与 `分` 之间那道缝是比例数字的字侧空白，与第 7 页 `（8分）`、第 8 页 `（10分）` 同判据）。**第 45 题**：题干四行照折行抄，折点分别在 `磁盘块` / `大小为`、`结构如` / `下图所示`、`间接地址项各` / `1 个`——三处都在汉字之间或汉字↔数字之间，合并安全（`各1 个` 中间无空格是折行所致，底本 `1` 前的空格已被 `inline_text` 归并）；`（盘块号）` 是全角括号、括号内无空格（与第 4 页 `证据（ ）` 那种留空括号不同，此处括号里**有字**，4 倍下 `盘块号` 三字完整）。三问各占一行、各成一问，按本卷口径写全角 `（1）（2）（3）`。**第 46 题**：题干四行照折行抄，折点在 `页面` / `大小为`、`某个` / `大小为`、`5000、` / `2896` 三处（后两处汉字↔数字、数字↔数字，合并安全）；`（0 表示未分配，1 表示已分配）` 括号内 `0`/`1` 两侧的空格是印刷的、照抄。**第 46 题第 1 问只到 `会存在哪种内`**：该句在第 10 页续完（`存碎片？` 及余下各问都在第 10 页），本页**只抄到本页印出的那一行**，不补、不猜后续文字。**OCR 误识已按放大结果改回**：`访向`→`访问`、`时．`→`时，`、`物理地址访问Cache时`→`物理地址访问 Cache 时`、`(2）`/`(3）`（半边半角）→全角 `（2）`/`（3）`、`45.（7分)`→`45. （7分）`（闭括号半边）、`以磁盘块`（草稿漏「以」）→照 4 倍图补、`其物理盘块号结构如`（草稿同）、`i. addr`→`i.addr`（图内，只登记不抄）、`46．（8分)`→`46. （8分）`、`页面`/`大小为`（草稿把 `页面` 后折行处粘成 `页面大小为`，本转录照折行写）。**标点**逐处：第 44 题第 2 问 `物理页号？`「哪几个字段？」「位置。」；第 3 问 `为多少？`「过程。」；第 4 问 `在主存中？`「软件处理？」「中断？」；第 45 题 `基本分配单位。`「1KB。」「磁盘中，」「如下图所示，」「（盘块号），」「10 个，」「地址项各 1 个，」「4B。」「编号。」；第 45 题三问 `多少？`「即可。」「9999、18000、420000」（顿号）、「偏移量。」「内容，」「磁盘，」「磁盘？」；第 46 题 `编址，」「256KB，」「1KB，」「所示（0 表示未分配，1 表示已分配）。」「执行，」「虚拟地址：」（冒号引出清单）、`726、…、2489。`（顿号）、第 1 问 `内存？`「存在，」「若有，」"

- page: 10
  source: "4 倍整页三段 `build/_scratch/probe/z3p10a.png`（y44—105：第 46 题第 1 问续文与第 2 问）、`z3p10b.png`（y190—250：第 46 题第 3 问与第 47 题题干）、`z3p10c.png`（y390—480：第 47 题四问与 MAC 表）；两张表 6 倍 `z3p10tab1.png` / `z3p10tab2.png`；第 47 题拓扑图 5 倍 `z3p10q47fig.png`；URL 两侧引号 40 倍 `z3p10qc3.png`。`page_bands.py` 量得 19 条墨迹带：#0 = 页眉、#1 = 第 46 题第 1 问续文 `存碎片？`（x145—175，接第 9 页末行）、#2—#4 = 第 46 题第 2 问三行、#5（76pt、x247—359）= 第 2 问的页表格式（两列、表头 + 4 个空行，属**数据表**，按 GFM 转录）、#6 = 第 46 题第 3 问、#7—#9 = 第 47 题题干三行、#10（128pt、x134—473）= 第 47 题的网络拓扑图（已登记 `figures.yml` 的 q47，`crop_figures.py` 裁出 `assets/q47-fig.png`，690×268，直读验收：虚线框、本地网络、主机 H、交换机三口、默认网关、DHCP 服务器、两台未命名 PC 与省略号齐全，无正文行裹入）、#11—#13 = 第 47 题第 1—3 问、#14（16pt、x225—383）= 第 3 问的空表（`MAC 地址 | 接口`，只有表头、没有表体，按 GFM 转录）、#15 = 第 47 题第 4 问、#16/#17（x530—531、宽 2px）= **扫描件右缘的竖直线**（非文字、非图，不转录、不登记）、#18 = 页脚。**跨页续句**：本页第 1 行 `存碎片？` 是第 9 页末行 `…会存在哪种内` 的下半句，页文件**首行不留空行**，`read_lines` 逐行拼接后合成一句 `会存在哪种内存碎片？`（第 10 页草稿原本开头有页眉行，被 `read_lines` 削成空字符串、会在句中插出一个空行——人工转录不带页眉，这个问题随之消失）。**第 46 题第 2 问**：三行照折行抄（`（页` / `表格式…`），折点在 `（页` 与 `表格式` 之间（汉字↔汉字，合并安全）；`4 个页框`、`FIFO` 两侧空格照印刷；括号后的标点是**全角逗号**（草稿读成 ASCII 句点 `.`，6 倍图上是带尾逗点，且此处并列的分句关系也要求逗号）。**折行吞掉的空格照实留空**：底本第 1 行末是 `采用 FIFO`、第 2 行以 `页面置换算法` 起，`join_lines` 只在「ASCII 字母数字↔ASCII 字母数字/`(`」之间补空格，合并后是 `采用 FIFO页面置换算法`（`FIFO` 后那一格是折行、不是印刷空格）——与第 9 页 `各1 个`、`0353H会产生` 同一类，**不挪折行、不补空格**。**页表格式表**：底本是两列框线表，表头 `页号 | 页框号（0 开始编址）`，下面**4 个空行**（作答栏）；按本卷 GFM 口径转写，空行保留为空单元格（不填、不猜）。空行**写成 `| | |`（单元格内只留一个空格）**：`force_break` 把「一行里有 2 处以上连续多空格」判成分栏/表格行并强行断段，实测写成 `|  |  |` 时被切成**四张各一行的表**（首轮生成即如此），只留单空格才保持成一张表；单元格内容仍是空的，不填、不猜。**第 47 题题干**：`47.（9分）` 的分值按本卷口径归一化为 `47. （9分）`；`1C-2B-50-15-ED-3A` 逐字核对（草稿同）。题干三行**合并成一行**写：底本第 2 行含 URL `http://www.abc.com`，其中 `/` 连写两遍命中 `md_from_pages.py` 的 `RE_CODE_LINE`（C 风格注释标记），会让 `force_break` 在该行前强行断段并置 `code_mode`，下一行再按「高汉字占比 + 无代码特征」退出去——实测三行版本被切成**三段独立段落**（首轮生成即如此）。故整句写一行，只动折行位置、字符与空格一字未改（与第 7 页第 39、40 题同一处理）。**URL 两侧的引号**：40 倍 `z3p10qc3.png` 下收尾引号只剩两点墨块（扫描分辨率到头了，看不出弯直），**不足以独立判定**；与第 2 页第 3 题、第 4 页第 20 题同卷同字体，按该两处的实测结论（两点直竖、无起收笔弯曲）统一写 **ASCII `\"`**，此处**点名留待原卷复核**——不是补字，是本卷内同字体的一贯口径（OCR 草稿读成弯引号，不作依据）。**第 47 题三问**：第 1 问句末是**句号**（`端口号。`，不是问号，4 倍下无问号的下伸点）；第 2、4 问问号按本页口径写全角 `？`；第 3 问句末是 `）。`（全角括号 + 句号）。**MAC 表**：底本只有表头一行 `MAC 地址 | 接口`、没有表体，按 GFM 写成**仅表头表**（表头 + 分隔行，无数据行），不伪造空行数量——底本没印行数，印的是「格式如下所示」。**OCR 误识已按放大结果改回**：`存碎片？`（草稿同）、`固定的4个页框`→`固定的 4 个页框`、`内存空间）.采川FIFO`→`内存空间），采用 FIFO`、`页而置换`→`页面置换`、`访问究上述`→`访问完上述`、`页而对应的页表`→`页面对应的页表`、`页表格式如下表所示）`（草稿漏前括号）、`(2）`/`(3）`→全角、`CPU处于内核态`→`CPU 处于内核态`、`47.(9分)`→`47. （9分）`、`接人`→`接入`、`主机的MAC`→`主机的 MAC`、`“http://www.abc.com”`（引号见上）、`（无其他通信过程）`（草稿同）、`交换机构造的MAC表`→`交换机构造的 MAC 表`、`目的IP地址`→`目的 IP 地址`。**标点**逐处：第 46 题第 1 问 `内存碎片？`（承上句）、第 2 问 `页框（分配内存时，首先分配低地址内存空间），」「之后，」「内容（页表格式如下表所示）。」、第 3 问 `中断时，」「状态？」「用户态？」；第 47 题题干 `网络，」「3A，」「网络后，」「com”（无其他通信过程）。」「拓扑和网络的通信过程回答下列问题：」（冒号）；四问 `端口号。」「源 IP 地址。」「过程后，」「所示）。」「多少？」。页眉 `27考研408模拟卷3·试题` 与页脚 `第10页／共10页` 属版式、不转录"
