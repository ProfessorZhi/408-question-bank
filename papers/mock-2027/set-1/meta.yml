options_in_figure:
  # 键必须加引号：YAML 1.1 会把裸 no 解析成布尔 False，题号会静默丢失。
  - "no": 3
    figure: assets/q3-fig.png
    verified_at: 2026-10-17
    # 底本把四个选项**做成矢量公式**，没有文字层：正文只剩 `A. ` `B. ` `C. ` `D. ` 四个空标记，
    # 公式本身在该图内、顺序与标记一一对应。已按 4× 渲染放大后逐行读过：
    #   A. M−(rear−front)   B. M−(rear−front)%(M−1)   C. M−(rear−front+M)%M   D. M−1−(rear−front+M)%M
    # 这里**只登记、不把公式抄成文字**——抄了就成了「人工补的字符」混在生成物里，
    # 下次重新生成会被覆盖，也没人分得清哪几个字是机器出的。公式一行仍是空的 A./B./C./D.
    # 另注：同题的题干也缺三个行内符号（数组名 `A[0,…,M−1]`、`front`、`rear`），
    # 同样是矢量绘制，同样只在这张图里——所以本题的图不只是「选项图」，是**题干的一部分**。
    verified_by: 人工直读该题图（4× 渲染裁图），图内四行公式依序对应 A./B./C./D.
