  source: "第 42 题续句 + 第 43—46 题。`build/_scratch/probe/page_bands.py` 量得本页 **33 条墨迹带**，其中 #0（y24—32）是页眉、#32（y748—757）是页脚、**#24（y416—541，高 125pt）是第 44 题的数据通路图**（与 `figures.yml` 的 q44 条 page8 414—543/162—460 吻合），剩 30 条文字带（y46—408 与 y551—652）。OCR 草稿非空行 43 行 − 图内散字 13 行（草稿 25—37 行：`OPMODOFFSET`/`PC`/`ZFSF`/`OF`/`+2`/`②`/`16`/`加法器`/`移位器`/`bgt` 等） = **30 行，与带数逐条对齐**，故草稿的行界就是印刷折行，据此定版。三条 8 倍横带 `r-s2-08-a.png`（y44—200）/ `r-s2-08-b.png`（y200—365）/ `r-s2-08-c.png`（y545—660）+ `r-s2-08-d.png`（y390—415，第 44 题第 3 小问）直读全文。**括号的全角/半角按墨高判定**（`ink_profile.py` 的列墨剖面带每块墨高；**2026-10-17 复核：这条判据只对「散文括号 vs 公式括号」的对比成立，不足以判子问题标记的括号，见文首「子问题标记形态」一节**；set-1 第 10 页 `（13分）` 是作者自己的文字层，可当正对照）：set-1 的全角「（」「）」墨高 **8.33/8.33pt**、数字 6.47—6.57；set-2 本页 `（8分）` 的两个括号墨高 **8.40/8.40** ⇒ 同为全角；`（大于零转移）` 的括号墨高 **8.40/8.80** ⇒ 全角；`P/V（wait()/signal()）`、`8页（Page）` 同属散文括号 ⇒ 全角。而**第 44 题公式里的括号记半角 `(SF⊕OF)`、`(PC)`**——这一条是**归一化**（全套语料的公式一律用 ASCII 括号），**不是**墨迹判定：2026-10-17 复核发现「墨高 7.60 vs 8.4—8.8」这条依据复算不出来（同一行 `P/V（wait()/signal()）` 上两种括号的墨高区间重叠，见文首「子问题标记形态」一节）；公式内 `+`/`=`/`⊕` 两侧量得 **2.0—2.8pt 空档**（而同字块内的字形间隙只有 0.4—0.8pt），说明作者在公式里敲了空格，但转录按本卷第 1—7 页与全套语料的紧凑写法记（属**归一化**，非临摹）。**标点类按墨高可干净分开**：`，`墨高 2.40、`：`墨高 4.00、`。`（底本的小实心点）墨高 1.60——第 44 题公式行 `表示，`（2.40）与 `=0。` 后那个点（1.60）据此判定为两类，前者照抄「，」、后者按全卷口径写「。」。**底本文字与 OCR 草稿的差异（已按放大结果改回）**：`4种运算操作`（草稿 `运笋`，且草稿把 ①②③ 之间的分号读成冒号）、`③top()` 行末为「：」、`④empty()`（草稿读成 ①）、`写入F`/`不可以写入`/`正在写入F`（草稿读成「写人」；作者文字层 `进入` 2/2 用「入」，全库 `写入` 16 处 vs `写人` 5 处）、`5MB/s，采用DMA方式`（草稿读成顿号）、`16位定长指令字格式，操作码位数`（草稿读成顿号）、`bgt` 三处（草稿读成 `bgu`/`bg`）、`编址单位`（草稿同）、`（3）以下是bgt指令…功能说明`（该行底本**没有句末标点**，照抄不补；草稿也没有）、`边缘的（8分）`/`（15分）`/子问题标记 `（1）`—`（3）` 一律全角（分值、子问题两项都有正对照：set-1 作者文字层分值 7/7 全角、子问题 26/26 全角；**本卷子问题标记的全角判定 2026-10-17 复核过，依据已换**——原先拿「字宽 23.2pt vs 墨迹 10.65—11.20pt」判半角不成立，已撤回，现据同页同行「标记首墨→其后首个汉字首墨」距离 17.60pt（set-1 真全角实测 17.20pt，ASCII＋半角空格只有约 13.4pt），详见文首「子问题标记形态」一节）。**第 44 题的指令格式框**（OP（操作码）MOD（寻址方式）OFFSET（偏移量），底本是三格并排的框）在转录里落成**独立一行的普通文本**，前后各留一空行使其自成段（GFM 单行表会把首行当表头，故不用表）。第 46 题的题干在本页以 `为此进程分` 收尾，续在第 9 页"

- page: 9
  source: "全卷末页：第 46 题续文 + 第 46 题的页表 + 第 46 题三个小问 + 第 47 题（题干、拓扑图、三个小问）。`build/_scratch/probe/page_bands.py` 量得本页 **17 条墨迹带**：#0（y24—32）页眉、#16（y748—757）页脚、**#3（y82—160，高 78pt）是第 46 题的页表**、**#11（y276—448，高 172pt）是第 47 题的拓扑图**（与 `figures.yml` 的 q47 条 page9 273—451/140—452 吻合），余 13 条文字带（y50—74、y168—268、y458—530）。OCR 草稿非空行 53 行 − 表内 24 行（草稿第 4—27 行：6 个表头字与 18 个被打散的单元格值）− 图内 16 行（草稿第 35—50 行：`Internet`/`200.101.1.1/30`/`R1`/`R2`/`R3`/`S1`/`Web服务器`/`H2`/`192.168.20.3` 等标注） = **13 行，与文字带逐条对齐**，故草稿行界即印刷折行，据此定版。**页表按 6 列 × 4 行落成 GFM 表**，列头 `页号|页框号|装入时刻|最近访问时间|访问位|修改位`，数据行 `0|4|28|178|1|0`、`1|3|121|159|1|0`、`2|7|19|185|1|1`、`3|1|50|165|0|1`——草稿把这张表读得七零八落（顺序错、漏格：`0 28 178 1 0 3 121 159 0 2 7 19 185 3 1 50 165 0`），故用两条 8 倍半宽放大图逐格复核：`build/_scratch/probe/z9-tabL.png`（x60—305，含前三列：`页号|页框号|装入时刻` 与 `0/4/28`、`1/3/121`、`2/7/19`、`3/1/50`）与 `z9-tabR.png`（x300—545，含后三列：`最近访问时间|访问位|修改位` 与 `178/1/0`、`159/1/0`、`185/1/1`、`165/0/1`）；两图合起来 6 个列头、24 个单元格**全部逐格读出**，无歧义。**问号的全角/半角有量化判定**：先用 `set1_glyph_locate.py` 在 set-1（作者本人的文字层）量同一份文件里两种字形的占位——全角 `？` 的 bbox 宽 **9.0pt**（第 1 页 x291.6—300.6），ASCII `?` 的 bbox 宽 **5.0pt**（第 1 页 x369.2—374.2；solution 里的 `len1 > len2 ? l1 : l2` 同）；再拿本页两条**段末行**当证人（段末行不受两端对齐拉伸：带 #13 墨迹止于 x292、带 #15 止于 x222，都不顶右边界 ≈502pt）——`号为多少？一定为1的标志字段有哪些？` 18 字总墨宽 163.06pt ⇒ **9.06pt/字**，`的IP地址分别为多少？` 9 个 CJK + `IP` 两字 ⇒ 92pt，与「全角？按 9pt 步进」的预期（163.06 / 92）吻合；若那 3 个问号是 ASCII `?`（5pt），两行应分别为 154pt、87pt，短 9pt、5pt，超出墨边测量误差。**原卷自己在这一点上不一致**：set-1 文字层 26 处句末问号里 24 处是全角、2 处是 ASCII（`那么有（）个不同的出栈序列?`、`最小时钟周期为多少?`，都在选择题题干结尾）——本卷按 24:2 的主流口径写全角 `？`，并把这两处例外记在这里备查（不改写、也不是我自造）。**第 46 题续文两行**（`配4个页框。在时刻190前的该进程访问情况见下表（访问位即使用位）。当该进程执行到时刻` / `190时，要读取逻辑地址为1B9DH的数据。请回答下列问题：`）见 8 倍 `z9-q46contL.png` 与 `r-s2-09-a.png`；第 46 题第 3 小问的收尾 `3号页框）。` 用 20 倍 `z9-q46sub3tail.png` 确认（**末字后确实有句末的实心点**，不是「）呢」之类）。**第 47 题三个小问的边界靠 `z9-q47subL.png`/`z9-q47subR.png`（各 8 倍半宽）定**：带 #12（y458—470）是第 (1) 问首行、#13 是第 (1) 问次行、**#14（y489—515，高 26pt）是第 (2) 问与第 (3) 问首行两条合成一带**、#15 是第 (3) 问次行——OCR 草稿**整个丢掉了第 (3) 问的首行**，于是它的第 54 行 `的IP地址分别为多少？` 成了孤儿，这正是「带 4 条 / 草稿 4 行」数目巧合但内容错位的陷阱；放大后补回 `（3）路由器R3和Web服务器收到的主机H发送的TCP释放报文封装的分组的源IP地址和目`。**第 47 题拓扑图不进正文**（本页 y276—448 整块是图，草稿第 35—50 行的散字即图内标注，不抄；归属见 `figures.yml` 的 q47 条）。OCR 误识改回清单：`但`→`在`、`访回`→`访问`、`婴送取`→`要读取`、`向题`→`问题`、`换算法`→`置换算法`、`IKB`→`1KB`、`1000．`→`1000，`、`一定为！`→`一定为1`、`进人处`→`进入到`、`此框号`→`页框号`、`装人时刻`→`装入时刻`、`股近访问时间`→`最近访问时间`。另记一处**照抄不补**：第 47 题第 (1) 问印作 `主机H一共发送了4000B的应用层`（8 倍图逐字确认，原卷疑漏「数据」二字），按原印记录、不顺笔补正。本页新增只读探针 `build/_scratch/probe/glyph_runs.py`（按列墨切字形块并报每块的 x 区间/宽/墨高，用于字形判定；用法 `python -I glyph_runs.py <pdf> <页码> <x0> <y0> <x1> <y1> [倍率] [阈值]`）。子问题标记 `（1）`—`（3）` 按全角记，依据与撤回经过见文首「子问题标记形态」一节"

