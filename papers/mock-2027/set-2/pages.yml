# 逐页人工转录的来源登记（mock-2027/set-2 试题卷）
#
# 本卷底本是**扫描件**，正文原本由 RapidOCR 识别。实测识别结果**不能当正文用**：
# 第 2 页 65 行里就有 40 余处字符错（`删除`→`别除`、`O(1)`→`0(1)`、`时间`→`时同`、
# `循环`→`衍环`、`哈夫曼`→`哈夫受`、`每个`→`等个`），另有版面级错误
# （并排的两个选项粘成一行、整张表读成一堆单格散字、指令序列的三列被打散）。
# 对题库来说这不是排版瑕疵，**每一条都是错题**。
#
# 换通道而不是加码：`build/_scratch/probe/ocr_dpi_cmp.py` 把同一页在 180 dpi 与 300 dpi
# 下并排跑过，误识**逐字相同**（该探针自带正/反对照：同 dpi 两次逐字节一致；缩到 0.4 倍
# 明显变差），说明这是模型层面的错，提高 dpi 治不了。
#
# 所以本卷正文改为**人工逐页直读页图**，落在同目录 `pages/page-NNN.txt`，
# 由 `tools/md_from_pages.py` 的 `load_page_overrides` 取用（其余页仍走 OCR 草稿）。
# 转录纪律见该函数 docstring，要点：按印刷折行照抄、并排选项拆成一行一个、
# 图/表标注不抄进正文、看不清的字不猜（写在下面 source 里）。
#
# 每条都要写 source：**凭什么说这一页抄对了**（渲染图路径 + 倍率 + 该页要点）。
#
# 两处**全卷统一的口径**，属于「照抄印刷」与可读性之间的取舍，逐条记在这里：
#   · **句末标点写作「。」**。底本（这套模拟卷的排版）句末印的是一个**小实心点**，
#     不是标准汉字全角句号那种空心圈；20 倍放大看过第 24 题那一处（`c-s2q24dot2.png`：
#     `…三个作业运行．三者的执行…`，点是实心小圆点、贴基线、占位比句号窄），
#     6 倍下第 15/16 题同类位置也是这个形态；OCR 同一处读成「．」（`page-005.txt` 第 6 行），
#     别处又读成「。」，两个通道在这点上不一致。全套语料（18 卷真题与 mock set-1）
#     一律用「。」，本卷跟着用「。」，特此声明这是**归一化**而非临摹。
#     **没有**把句子中间那些确实印着「，」「、」的地方改掉——那些按印刷照抄。
#   · **下标按平面写法记**（`I1`/`I2`/`P1`/`R1`/`aij`），不写上下标标记
#     （与全套语料一致；见 `tools/md_from_pages.py` 对竖排标记的立场）。
#
# 另外：本文件登记过的页在本卷里**一律不套 OCR 宽容口径**（`paragraphs_of` 的
# `hand_pages`，由 `load_page_overrides` 的页号集合直接给出，不需要额外开关）。
# 那套宽容是为了补 OCR 丢掉的**分隔符**；人工转录不做 OCR，套上去只会把正文切碎——
# 实测：第 4 页第 21 题的题干是一整句，其中一行以 `CPU` 开头，被宽容口径当成「C 选项行」
# 强行断段，题干中间裂出一个空行（那是工具造的，不是底本的版式）。
# 已核对：改动前后 18 卷真题 + set-1 的输出**逐字节一致**（它们没有登记页）。

# ---------------------------------------------------------------------------
# 【子问题标记形态：全角 `（1）` —— 2026-10-17 复核；本条**替换**当天早些时候的错误结论】
#
# 结论：本卷（题目卷与答案卷一样）的子问题标记记**全角** `（1）`/`（2）`/`（3）`，
# 标记后**不加空格**。含标记的行共 33 处：题目卷第 7/8/9 页 15 处、答案卷第 6—9 页 18 处
# （答案卷同口径记在 `solution-pages.yml`）。
#
# 撤回的错误结论：曾据「全角 `（9分）` 墨迹宽度 23.2pt vs 半角 `(n)` 10.65—11.20pt」，
# 把上述 33 处改成半角 `(1) `。那条判据**不成立——两侧量的不是同一种量**：
#   · 23.2 这个数只对得上 set-1 文字层里**字宽**（advance）：`（1）` = 9.00 + 5.01 + 9.00
#     = **23.02pt**（若是 `（9分）` 四个字则是 32.01pt）；也就是说当时量的是字宽。
#   · 10.65—11.20 是扫描件上的**墨迹跨度**。
# 汉字全角括号的字形**向被括内容抱拢**：`（` 的墨落在字身框右缘、`）` 的墨落在左缘，
# 于是 `（1）` 的墨迹跨度只有 11.20pt，而其字宽是 23.02pt——同一个全角标记，两个数差一倍。
# **反证**：set-1 自己的 `（1）`（作者文字层，确证 U+FF08/U+FF09，见该 PDF 文字层
# `（` x93.53—102.53 宽 9.00、`1` x102.53—107.54 宽 5.01、`）` x107.54—116.55 宽 9.00）
# 实测墨迹跨度 = 99.40 → 110.60 = **11.20pt**，正落在当时被当作「半角」的那个区间里。
#   复算命令：`python -I build/_scratch/probe/glyph_runs.py
#   sources/mock-2027/pdf/mock2027-set1-paper.pdf 10 88 310 150 324 10`
#
# 现行判据（**同一行、同一 y 带内取差值**——扫描件有轻微倾斜，同带内相减把倾斜消掉，
# 跨行的 x 比较不可信）：「标记首墨 x」→「其后第一个汉字的首墨 x」的距离。
#   · set-1 第 10 页 `（1）给出算法的基本设计思想`：**17.20pt**
#     （= 字宽 23.02 + 汉字左墨偏 0.05 − 括号左墨偏 5.87，逐项可复算）。
#   · set-2 第 8 页 `（1）该计算机的编址单位是多少？…`：**17.60pt**
#     （`glyph_runs.py` 20 倍、阈值 5px：标记三块墨 135.55/139.55/143.15，汉字首墨 153.15；
#      另两条同页标记行 `（2）…`/`（3）…` 的标记墨迹跨度同为 10.00pt）。
#   · 若真是 ASCII `(1)`＋空格：字宽 3.00 + 5.01 + 3.00 = 11.01，配半角空格 2.5 ⇒ 距离约
#     **13.4pt**；配全角空格 9.0 ⇒ 约 **19.9pt**。实测 17.60 两头都不靠；
#     全角 `（1）` 无空格预测 **17.6pt**，吻合。
#   · 字号已核对同号：set-2 同页汉字步进实测 8.80/9.20/8.80pt（第 8 页 y596—608 连续汉字
#     的墨起点 366.70/375.50/384.70/393.50），set-1 为 9.00pt。
#
# 顺带查实（用**同一行上两种括号并存**的那一处当对照）：`请使用信号量P/V（wait()/signal()）操作`
# （本卷题目卷第 8 页 y596—608）——全角括号与 ASCII 括号在这份扫描件上**墨迹几何几乎不可分**：
# 该行括号类墨块宽 1.20—2.00pt、墨高 6.40—8.00pt，两种括号的区间互相重叠；set-1 的全角 `（`
# （文字层确证）墨宽也只有 2.20pt。⇒ **本卷不能靠墨宽/墨高判括号的全半角**。
# 因此下面第 8 页 source 里「公式括号墨高 7.60 ⇒ 拉丁字形」那条依据同样**作废**：
# 公式括号仍记半角，但理由是**全套语料的归一化**（公式一律写 ASCII 括号），不是墨迹判定。
#
# 语料口径（2026-10-17 重数，替换旧记的「188 全角 vs 6+9 半角」）：
#   `papers/**/*.md` 的行首子问题标记：全角 **559** 处、半角 **17** 处；这 17 处**全部落在
#   真题答案卷**（exams/2017 8 处、exams/2016 5 处、exams/2014 3 处，另 mock set-1 答案卷 1 处），
#   且所在行本身仍是满篇 OCR 残（`Cl分）`/`1/0`/`(SOMHz)`/`fl(23)与双23)`/`阶码全L 尾数全O`），
#   属 OCR 自己在 `（`/`(` 之间摇摆，不是底本口径；那几处留待各卷自己的复核清单，本卷不跟。
