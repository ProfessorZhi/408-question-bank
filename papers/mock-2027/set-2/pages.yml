  source: "第 01—07 题之后的下半页，直读第 28—36 题。定位靠三条 6 倍带尺横带 `build/_scratch/probe/r-s2-06-a.png`（y40—210）/ `r-s2-06-b.png`（y280—490）/ `r-s2-06-c.png`（y205—300）——全宽横带的有效倍率被显示端上限压到 3.36×，先用烧进图里的红色刻度尺读出各行 y 坐标，再用 `render_xy.py` 定点放大（此后所有判读都不是靠肉眼估坐标）。标点逐处按 13—33 倍小方块核对：`编址，`（13×，`c-s2p6z1.png`）、`完成、系统回收`（20×，`c-s2p6mk3.png`）、`位置为100、正在`（20×，`c-s2p6mk2.png`，粗短楔形＝顿号）、`200Hz，`与`目标，`（13×，`c-s2p6q32b.png`——**OCR 在这三处读作「、」是错的**，放大后可见是带尾的逗号）、`报文的结构的说明`（16×，`c-s2p6n4.png`——6 倍下我读成「报文的结构说明」，放大证实 OCR 的「报文**的**结构**的**说明」是对的）。**选项内的数值分隔符是两可写法，本页按与第 5 页一致的「半角逗号 + 空格」记**：列墨剖面（`i-s2p6q29.png`/`i-s2p6q29B.png`/`i-s2p6q30.png`/`i-s2p6q31.png`）量得第 27 题选项单位 14.2pt、本页第 29 题 6.0—6.45pt、第 30 题 4.85pt、第 31 题 ≈9.25pt，而**所有分隔符的墨迹宽一律 2.00pt（同一字形）**——「，」的全角占位（em≈9.5pt）与「, + 空格」（4.75+4.75）在扫描件上几何退化、逐像素不可区分，故这是口径选择而非临摹；第 5 页已按同一口径记，两页保持一致。第 33 题的罗马数字条目与并列词按第 4 页确立的写法（`I. `/`II. `/`III. `、`A. I、II`）。**第 36 题的四个选项印在第 7 页顶端**（本页第 36 题题干之后即空白与页脚「第 6 页 / 共 9 页」），故本页以题干收尾、下一页以那四个选项开头。第 34 题的波形图不进正文（见图 `figures.yml` 的 q34 条，6 倍 `c-s2q34b.png` 确认边界）。OCR 草稿的误识另有一批已按放大结果改回：`编址、`、`回收北内存`、`一级索引l分配方法`、`引I人了`、`检素`、`B.32.S`、`C.16.5.5.5`、`IVO方式`、`通信顾序`、`数据顿/确认顿`、`忽路`，以及第 35 题选项 D 的 `(n-1)x/B`（实为 `(n-1)X/B`）"

