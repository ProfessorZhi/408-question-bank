# 扫描卷插图的人工登记（mock-2027/set-2）
#
# 为什么扫描卷必须人工登记：`fig_crop.py` 靠坐标层找「位图对象/图形簇」+ 文字层的题注行，
# 而扫描卷**整页就是一张位图**（`408-objects/mock-2027-set-2/page-002.json`：
# `lines=0, clusters=0, images=1`），自动流程只会把整页裁下来——正是用户禁止的「整页截图」。
# 所以这里逐张把区域登记下来，`tools/crop_figures.py` 照单渲染。
#
# y0/y1 是 PDF 点坐标（页面 595×841）。定法：先用
# `build/_scratch/probe/page_bands.py` 量出该页的**墨迹行带**（文字行是窄带，图是一块高带），
# 再把候选带 ±边距渲染出来直读确认。x0/x1 用来把大片留白切掉。
#
# `source` 写清「凭什么说这块是第 N 题的图」。

- q: 7
  page: 2
  y0: 528
  y1: 602
  x0: 235
  x1: 355
  source: "页图直读：墨迹带 #30 = y532..661（图 + 四个矩阵选项连成一带）。矩阵部分已按 recovered-lines.yml 转成 LaTeX，故只裁图：y528..602 以 6× 渲染成 build/_scratch/probe/c-s2q7.png，可见四个圈结点 1/2/3/4 与 4→1、4→2、4→3、2⇄3 的边"

