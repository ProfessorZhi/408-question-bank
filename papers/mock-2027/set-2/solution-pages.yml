# 逐页人工转录的来源登记（mock-2027/set-2 答案卷／解析卷）
#
# 底本 `sources/mock-2027/pdf/mock2027-set2-solution.pdf` 是**扫描件**（9 页，515.88×728.52），
# 正文原本由 RapidOCR 识别。答案卷比题目卷更依赖 OCR，而这一卷恰好是**代码 + 表格**为主的：
#   · 第 41 题（两段 C 代码）、第 42 题（C++ 代码）、第 45 题（信号量代码）——OCR 把缩进与空格
#     整块吃掉，实测原样落在 `solutions.md` 里的是 `1/判断数组是否为非递减数组`（`//` 读成 `1/`）、
#     `for（inti=1;i<n;++i）`、`inttmp=A[i]；`、`elseA[i]=A[i-1];`、`stack<int>inStack，outStack;`；
#   · 第 46 题的结果表（6 列 × 4 行）被读成 **30 行单格散字**，表结构整个没了，而且第 2 行丢了
#     最后一格（`… 185 / 0` 后面直接接下一行的 `6`）；
#   · 还有**貌似确定、实则错误**的字：`A[]`（应为 `A[i]`，同页出现 3 次）、`0(n)`（应为 `O(n)`）、
#     `IO`（底本印的是 `I/O`）、`bg`/`bgu`（应为 `bgt`）、`进人`（应为 `进入`）。
#     这类错字在正文里看不出来，只能人对着页图逐字抄。
#
# 所以本卷这四页（第 6—9 页，即综合题 41—47 的全部解答）改为**人工逐页直读页图**，落在同目录
# `solution-pages/page-NNN.txt`，由 `tools/md_solutions.py::load_solution_overrides` 取用
# （第 1—5 页仍是 OCR 草稿：卷首答案表 + 41—47 的简短评分要点 + 选择题 1—40 的解析流）。
# 登记格式与题目卷 `pages.yml` **完全一致**（一页一条 `page` + `source`，不准重复、不准有孤儿文件）。
# 被接管的页不再跑页眉页脚剥离，也不再套「选择题答案行」那类启发式——转录者自己决定内容。
#
# 全卷统一的口径（与题目卷 `pages.yml` 同一套，答案卷跟着用；凡属取舍，逐条记在这里）：
#   · **句末标点写作「。」**（底本印的是小实心点，见题目卷 `pages.yml` 的说明，属归一化非临摹）。
#   · **下标按平面写法**（`S1`/`S2`/`F`），不写上下标标记。
#   · **公式紧凑写法**：底本在 `=`/`+`/`×`/`<` 两侧敲了空格（实测第 44 题公式内 2.0—2.8pt 空档，
#     题目卷 `pages.yml` 第 8 页条目有量化记录），转录按紧凑写法记（属归一化）。
#     例：`计算机时钟周期为1/500MHz=2ns，每次I/O用时5×20×2ns=200ns`。
#   · **短横一律 ASCII `-`**（无 U+2212）：第 44 题的 `16-6-2=8位`、`-128~127`。
#   · **二进制按底本印的分组照抄**：`1B9DH=0001 1011 1001 1101B`、页号 `00 0110B=06H`。
#   · **全角/半角的界线**：散文括号与分值用全角（`（带符号整数）`、`（写出这个即可给分）`）；
#     公式里的括号用半角（`(PC)+2+(-128×2)`）——这是全套语料的**归一化**（公式一律写 ASCII 括号），
#     不是墨迹判定；**子问题序号用全角 `（1）`—`（3）`**（2026-10-17 复核后改回全角：当天早些时候
#     曾据「四字形 `（9分）` 23.2pt vs 三字形 `(1)` 10.65pt」判成半角，已撤回；依据与反证见题目卷
#     `pages.yml` 文首「子问题标记形态」一节）。本卷答案页带标记的行共 18 处（第 6 页 5、第 7 页 6、
#     第 8 页 4、第 9 页 3），标记后不加空格。
#
# 答案卷特有的三条（题目卷没有的版面，随代码/表格而来）：
#   · **代码用 ```c 围栏**（全套语料只有 ```c / ```text 两种语言标记，共 39 / 18 处，无 ```cpp；
#     第 42 题的 `stack<int>` 虽是 C++ 写法，仍按本卷口径记 ```c）。围栏内的行**原样照抄**：
#     不 strip、保留空行与缩进。底本代码块的基准缩进是**第 0 列**（页图里 `bool nonDecrease(...)`、
#     `stack<int> inStack, outStack;`、`semaphore mutex = 1;` 都顶在代码框左沿），相对缩进按
#     4 空格一级照抄（第 41/42/45 题都是这个步长）。
#   · **代码行末注释的列对齐归一化为「单空格」**。底本是按块各自对齐的（第 45 题四行声明的
#     `//` 落在同一列，`P(read);` 那些又落在另一列，即用了制表位），扫描件上逐行量不准列号，
#     而同卷第 41 题的代码本来就是「语句 + 单空格 + //注释」（`int count = 0; // 递减相邻元素出现的次数`），
#     故本卷代码统一按单空格记；丢掉的只是**排版信息**，不影响代码语义。
#   · **表格用 GFM 表**（第 46 题结果表）。底本里 `结果如下表所示。` 与表之间**没有空行**，
#     而 GFM 表不能中断段落，所以 `md_solutions.join_cjk()` 在表前替底本补一个空行
#     （题目卷的 `md_from_pages.py` 也是这个口径，见 `questions.md` 里的表前后都有空行）。
#
# 工具侧配套改动（`tools/md_solutions.py`，2026-10-17）：`parse_comprehensive` 增加围栏收集
# （围栏内不 strip、不留空行以外一视同仁）、`join_cjk` 增加围栏与表格处理。**对真题 18 卷是空改动**：
# 全批 483 个 `page-*.txt` 里含 ``` 的为 0 处；以 `|` 开头的只有 1 行（`exams/answers/2022-answer/page-009.txt`
# 第 15 行，是一张目录树插图的版面残留），且它不在任何综合题段里（`join_cjk` 根本看不到它）。
# 实测回归：改前改后 `exams/2026` 与 `exams/2022` 的报告**逐字节相同**（sha256 对照，见
# `build/_scratch/probe/patchctl/`）。

- page: 6
  source: "第 41 题的两个解法（简单解法 / 标准解法）全在本页，页首无题头——题头 `41.【解析】` 在底本第 5 页末行（那一页仍是 OCR 草稿），本页直接从 `一、简单解法：` 起。`build/_scratch/probe/page_bands.py` 量得本页 **45 条墨迹带**：`一、简单解法：` #1（y54）、简单解法的代码 #5—#22（y119—353）、`(3)` 与 `二、标准解法：` #23—#31（y369—502）、标准解法的代码 #32—#43（y513—659，其中 #40/#41/#43 是 1px 宽的孤立 `}`）、页脚 #44。三张 8 倍定点渲染直读：`z-p6-codeA.png`（x85—345 y115—362，简单解法整段代码）、`z-p6-codeB.png`（x85—345 y505—670，标准解法整段代码）、`z-p6-codeB-right.png`（10 倍，x230—450 y570—620，补看两行超宽行与注释的右半），另有 6 倍 `z-p6-prose.png`（x50—490 y360—505）核对散文。**代码块要点**（对照 OCR 草稿整块报废的样子）：基准缩进是**第 0 列**（#5 `// 判断数组是否为非递减数组` 的墨迹起于 x94、#6 `bool nonDecrease(int *A, int n) {` 起于 x93，两者齐平 ⇒ 注释与函数签名同级，我原来按「整块再缩进 4 空格」记是错的，已改）；行末注释是「语句 + 单空格 + `//` 」（`int tmp = A[i]; // 保存原来的值`）；`//` 后有空格（`// 判断数组是否为非递减数组`），**底本自己不一致**：代码语句里写 `A[i - 1]`（带空格），而两处注释里写 `A[i-1]`（不带空格，见 `z-p6-codeB-right.png` 的 `A[i-1]的情况，则改变A[i]` 与 `A[i-1]所以不用改变A[i-1]的值`）——照抄，不改齐。函数之间的空行（`bool nonDecrease` 之后、`int dequeue()` 之前那种）按页图的带间距照留。散文按本卷紧凑口径记（底本 `时间复杂度为 O(n) 的函数`、`优先把 A[i-1] 大小改为 A[i]`、《O(n²)》里的上标 `²`）：`O(n)`、`O(n²)`、`A[i-1]`、`A[i-2]`。OCR 草稿在这一页的形近误识（`1/` 代 `//`、`inttmp`、`A[]`、`0(n)`、`elseA[i]`）**一处都不沿用**。"

- page: 7
  source: "本页三块内容：第 41 题标准解法的第 (3) 问（**页首一行，说明第 41 题跨 5—7 页，第 6 页并不独占该题**）、第 42 题全部、第 43 题全部、第 44 题的第 (1)(2) 问（第 (2) 问末行 `相对于bgt指令的前254个单元到后256个单元之间。` 收在第 7 页，余下的第 (3) 问在第 8 页）。`page_bands.py` 量得 **39 条墨迹带**，与 OCR 草稿的 39 行**逐条对齐**（#0 页眉、#1 第 41 题 (3)、#2—#4 第 42 题的三行散文、#5—#22 第 42 题的代码、#23 `43.【解析】`、#24—#29 第 43 题、#30 `44.【解析】`、#31—#37 第 44 题、#38 页脚）。直读用 6 倍三张横带 `r-s2-07-a.png`（y30—250）/`r-s2-07-b.png`（y250—500）/`r-s2-07-c.png`（y500—790），加两张定点放大：`z-p7-codehead.png`（16 倍，x80—320 y116—135）与 `z-p7-semi.png`（**20 倍**，x90—340 y400—416）。**第 42 题的代码**共 24 行（含 3 处空行），基准缩进第 0 列（带量：`void in2out()` 起于 x82、`while (!inStack.empty()) {` x99、`outStack.push(inStack.top());` x122 ⇒ 每级 4 空格）。OCR 草稿在这一块**丢了 3 个收尾花括号、还把 1 个 `}` 读成 `{`**（草稿第 18 行那个 `}`、第 20 行的 `{`）——所以「草稿行数 = 墨迹带数」在这里靠不住，代码段只能按页图抄。**一处照抄不补**：`bool empty()` 里的 `return inStack.empty() && outStack.empty()` **底本漏印了分号**（20 倍图上整行墨迹止于 `)` 之后，后面没有 `;` 字形），按原印记录、不顺笔补，已记入 `meta.yml` 待人工复核。散文里的 `I/O` 底本印的是带斜杠的写法（`每次 I/O 用时`、`不能用中断 I/O 方式`），OCR 读成 `IO` 是错的；`0(n)` 应为 `O(n)`；`bg`/`bgu` 应为 `bgt`。第 43/44 题公式里的空格按本卷紧凑口径归一化（底本 `1/500MHz = 2ns`、`400 × 2 = 0.8μs`、`16 − 6 − 2 = 8 位`、`−128 ~ 127` ⇒ `1/500MHz=2ns`、`400×2=0.8μs`、`16-6-2=8位`、`-128~127`）。**关于子问题序号全角/半角的更正（2026-10-17 复核）**：本题前文据「`（9分）` 墨迹跨度 23.2pt vs 本卷 `(1)` 10.65—10.75pt」判定本卷子问序号是**半角 `(n)`**，这一判定**已撤回**——两组量的不是同一种东西：`（9分）` 是**四个字形**（（、9、分、））的跨度，`(1)` 是**三个字形**（（、1、））的跨度，字形数不同本就不能比。真正可比的是**同一个三字形**：set-1 第 10 页的 `（1）` 在作者文字层里确证是 U+FF08/U+FF09（全角），其**墨迹跨度实测 11.20pt**，与当时被当作「半角」的本卷标记 10.65—11.20pt **同值**；差一倍的 23.2pt 是四字形的 `（9分）`。另一条独立判据同向：同页同行「标记首墨→其后首个汉字首墨」的距离，本卷实测 **17.60pt**、set-1 真全角实测 **17.20pt**（两卷字号同为 9pt：本卷同页汉字步进 8.80/9.20/8.80pt），而若真是 ASCII `(1)`＋半角空格只有约 13.4pt。故本卷两卷（题目卷 15 处 + 答案卷 18 处）**统一按全角 `（n）` 记、标记后不加空格**，OCR 初稿的多数读法也是全角。依据与复算命令见题目卷 `pages.yml` 文首「子问题标记形态」一节；`tools/md_from_pages.py` 的 `RE_SUBQ` 两种都收，工具侧不受影响。"

- page: 8
  source: "本页四块内容：第 44 题第 (3) 问的收尾散文（`对于单地址指令…即0~255。` 与 `(3) ①存放指令…`）、第 45 题全部（信号量代码）、第 46 题的三个小问（含 `结果如下表所示。`，表本身在第 9 页）。`page_bands.py` 量得 **32 条墨迹带**（#0 页眉、#31 页脚、#21 `46.【解析】`，余下 30 条文字带；第 45 题的代码段 #7—#20 被合并成 14 条带，代码行距 ≈5.7pt 远小于正文的 15pt，故带数不能当行数用）。直读用 `z-p8-q45.png`（**6 倍整块**，x66—372 y144—500，一次把第 45 题代码从头看到尾）+ 6 倍 `r-s2-08-a.png`（y44—200）/`r-s2-08-b.png`（y200—365）/`r-s2-08-c.png`（y545—660）/`r-s2-08-d.png`（y390—415）+ `rr-p8-mid.png`（第 46 题 (2)(3) 与表前收尾）。**第 45 题的代码**共 34 行，基准缩进第 0 列，**两处空行**（四行信号量声明之后、`writer()` 的收尾括号之后各一，页图上是一整行的空档），行末注释按本卷口径记单空格（底本是对齐到制表位的，见第 45 题 `//` 列位）。结构上注意：`if(count == 0)` 的 `P(lock);` 比它深一级（8→12 空格），`if(count == 0){` 块的 `V(lock);`/`V(read);` 同理；`reader()`/`writer()` 的函数体收尾是 `}` + `}`（先收 while 再收函数）。第 44 题第 (3) 问的 `IR`（指令寄存器）与 `OFFSET`（带符号整数）按印刷照抄，散文括号全角。**第 46 题有两处照抄不改的底本缺陷**：第 (1)(2) 问印的物理地址二进制是 `0001 1111 1001 1101B=1F9DH` 与 `0000 1111 1001 1101B=0F9DH`——高 6 位页框号（07H、03H）与算法结论一致，但**低 10 位抄错了**：逻辑地址 `1B9DH=0001 1011 1001 1101B` 的低 10 位是 `0110011101`，底本却印成 `1110011101`（第 2 个半字节 `D` 印成 `F`），正确答案应是 `1D9DH`/`0D9DH`。二进制与十六进制在底本里**互相自洽**（`0001 1111 1001 1101B` 正是 `1F9DH`），所以这不是 OCR 错、是底本算错／印错；按原印记录，已记入 `meta.yml` 待人工复核。核对用的定点放大：`r-s2-08-c.png`（8 倍，y545—660）与 `rr-p8-mid.png` 两处都把 `1111 1001 1101B` 与 `1F9DH`／`0F9DH` 读到了同一结果。第 (3) 问的 `3→4→7→1` 箭头用 `→`（U+2192，本卷语料里就是它）。"

- page: 9
  source: "全卷末页：第 46 题的结果表 + 第 47 题（三个小问，题头 `47.【解析】`；第 47 题的拓扑图不进正文，归属见题目卷的 `figures.yml`）。`page_bands.py` 量得 **12 条墨迹带**：#0 页眉、**#1（y52—126，高 74pt，x130—391）就是那张结果表**、#2—#10 是第 47 题（#2 题头 y134、#3—#5 第 (1) 问三行、#6—#7 第 (2) 问两行、#8—#10 第 (3) 问三行）、#11 页脚——**表 1 条带 + 第 47 题 9 条带**，与 OCR 草稿「表散成 30 行 + 第 47 题 9 行」正好对得上。表用 8 倍定点渲染 `z-p9-table.png`（x100—430 y40—150）整张直读，**6 个列头 + 24 个单元格全部逐格核过**，落成 GFM 表 `0|4|28|178|0|0`、`1|3|121|159|0|0`、`2|7|19|185|0|1`、`6|1|190|190|1|0`：前三行是原页表把命中页的访问位清 0 的结果（0 号、1 号由 1 变 0；2 号是这一轮要找的「访问位 0、修改位 1」的牺牲页），第 4 行是装入时刻 190 刚调入的 6 号页（页框号 1 即原 3 号页的框，访问位 1）。**OCR 草稿在这一页把表读成了 30 行单格散字**（`页号/页框号/装入时刻/…` 各占一行），而且第 2 行丢了最后一格，绝不能沿用它。第 47 题的文字按 6 倍 `rr-p9-a.png` 直读（#12—#15 那次「两条带合成一带」的坑在题目卷第 9 页条目里记过，本页第 47 题对应 `(2)/(3)` 首行由 6 倍图确认）。照抄不补的两处：第 (1) 问句末是 `；`（不是 `。`），最后一行的 `源地址依旧为200.101.10.5。` 收句末 `。`；`进入`（OCR 读成 `进人`，本卷语料 `写入` 16 处 vs `写人` 5 处，按印刷的 `入` 记）。`2MSL`、`900ms`、`4001`、`5001` 与第 (3) 问的两个 IP 地址逐字核过。"
