name: QA

# 设计立场（见 docs/qa-policy.md §7）：
#   阻断 = 「已经错了」：图片缺失(C7)、答案泄漏(C8)、来源哈希漂移
#   不阻断 = 「还没做完」：题目数未达 47/47 —— 这是**已知且被接受**的状态
# 把建设中仓库的 CI 全绿是自欺；真正的护栏是让完成度可见。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pyyaml jsonschema

      - name: 校验 schema 本身是合法 JSON
        run: python -c "import json,glob,sys; [json.load(open(f,encoding='utf-8')) for f in glob.glob('schema/*.json')]; print('schema ok')"

      - name: 质检脚本自测（必须能翻红也能翻绿）
        run: python tools/selftest_qa.py

      - name: 构建器对照自测（必须识别缺图、缺题、泄漏）
        run: python tools/selftest_build.py

      - name: 408 知识图谱完整性与真题锚点校验
        run: python docs/knowledge-graph/408/check.py

      - name: 用 schema 校验所有 meta.yml
        run: python tools/validate_meta.py

      - name: 来源清单新鲜度（sources/ 只增不改）
        run: |
          python tools/inventory.py -o /tmp/manifest.json
          python - <<'PY'
          import json, sys, pathlib
          new = json.load(open('/tmp/manifest.json', encoding='utf-8'))
          old_p = pathlib.Path('index/sources-manifest.json')
          if not old_p.exists():
              print('::warning::index/sources-manifest.json 不存在，跳过比对')
              sys.exit(0)
          old = json.load(open(old_p, encoding='utf-8'))
          oldmap = {r['path']: r['sha256'] for r in old['files']}
          drift = [r['path'] for r in new['files']
                   if r['path'] in oldmap and oldmap[r['path']] != r['sha256']]
          if drift:
              print(f'::error::sources/ 下文件被改写（哈希漂移）：{drift}')
              sys.exit(1)
          print(f'sources/ 哈希一致（{new["count"]} 个文件）')
          PY

      - name: 全量质检
        run: |
          python tools/qa_paper.py --all \
            --json index/qa-report.json --write-coverage | tee /tmp/qa.txt

      - name: v1 全量构建与 42 份产物验收（不包含 2026）
        run: |
          python tools/build_paper.py --all --both -o /tmp/408-v1-build
          python tools/selftest_build.py --verify-built /tmp/408-v1-build

      - name: 完成度写进 job summary
        if: always()
        run: |
          {
            echo '## 408 题库 · 全量质检'
            echo
            echo '```'
            cat /tmp/qa.txt || true
            echo '```'
            echo
            cat index/coverage.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传质检产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            index/qa-report.json
            index/coverage.md
          if-no-files-found: warn
