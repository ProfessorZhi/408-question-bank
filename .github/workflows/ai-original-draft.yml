name: AI Original Draft QA

# Isolated authoring checks. No repository write permissions or device agents.
on:
  push:
    paths:
      - "drafts/ai-original/set-01/**"
      - ".github/workflows/ai-original-draft.yml"
  pull_request:
    paths:
      - "drafts/ai-original/set-01/**"
      - ".github/workflows/ai-original-draft.yml"
  workflow_dispatch:

jobs:
  complete-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all 47 authored questions and metadata
        run: python drafts/ai-original/set-01/check_plan.py
      - name: Reproduce SVGs and cross-check calculations, C code and state machines
        run: python drafts/ai-original/set-01/verify_paper.py --json /tmp/ai408-validation.json
      - name: Upload reproducible validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai408-set01-validation
          path: /tmp/ai408-validation.json
          if-no-files-found: warn
