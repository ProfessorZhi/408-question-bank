<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="505" viewBox="0 0 1180 505" role="img" aria-labelledby="title desc">
<title id="title">Q46 initial copy-on-write shared page mappings</title>
<desc id="desc">P and C initially share VPN0, VPN1 and VPN2 using frames F2, F5 and F8. Each virtual mapping is read-only COW, and each physical frame has reference count two.</desc>
