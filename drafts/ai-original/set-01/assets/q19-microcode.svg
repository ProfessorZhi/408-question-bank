<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="310" viewBox="0 0 1060 310" role="img" aria-labelledby="title desc">
<title id="title">Q19 microinstruction field format</title>
<desc id="desc">Two parallel microcommand groups with separate encoded fields; all-zero means idle in each group. The next address and branch selector have fixed widths. Field boxes are not drawn to bit scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#111} .line{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style>
<metadata>{&quot;figure_id&quot;:&quot;q19&quot;,&quot;renderer&quot;:&quot;render_figures.py/v1&quot;,&quot;spec_sha256&quot;:&quot;5d1ddc6256f2179ade674aca1919efa468a86d28516b686a3ff20e965cf07305&quot;}</metadata>
<rect width="1060" height="310" fill="white"/>
<rect x="50" y="110" width="220" height="100" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="A"/>
<rect x="300" y="110" width="220" height="100" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="B"/>
<rect x="550" y="110" width="230" height="100" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="next"/>
<rect x="810" y="110" width="200" height="100" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="branch"/>
<text x="160" y="150" font-size="25" text-anchor="middle" font-weight="700">Group A</text>
<text x="160" y="182" font-size="19" text-anchor="middle">4 commands + idle</text>
<text x="410" y="150" font-size="25" text-anchor="middle" font-weight="700">Group B</text>
<text x="410" y="182" font-size="19" text-anchor="middle">3 commands + idle</text>
<text x="665" y="150" font-size="23" text-anchor="middle" font-weight="700">Next address</text>
<text x="665" y="182" font-size="21" text-anchor="middle">8 bits</text>
<text x="910" y="150" font-size="23" text-anchor="middle" font-weight="700">Branch mode</text>
<text x="910" y="182" font-size="21" text-anchor="middle">2 bits</text>
<text x="530" y="62" font-size="21" text-anchor="middle">A and B may operate in parallel; each group issues at most one command.</text>
<text x="530" y="270" font-size="21" text-anchor="middle">Find the MINIMUM total width. Field boxes are not to bit scale.</text>
</svg>
