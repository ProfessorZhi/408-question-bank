<rect width="1200" height="450" fill="white"/>
<rect x="40" y="100" width="185" height="80" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="IF"/>
<text x="132.5" y="132" font-size="25" text-anchor="middle" font-weight="700">IF</text>
<text x="132.5" y="160" font-size="17" text-anchor="middle">PC / instruction</text>
