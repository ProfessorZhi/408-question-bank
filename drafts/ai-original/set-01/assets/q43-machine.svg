<text x="360" y="42" font-size="18" text-anchor="middle">taken branch: flush IF + ID; refetch target</text>
<text x="132.5" y="87" font-size="20" text-anchor="middle">180 ps</text>
<text x="362.5" y="87" font-size="20" text-anchor="middle">220 ps</text>
<text x="592.5" y="87" font-size="20" text-anchor="middle">200 ps</text>
<text x="822.5" y="87" font-size="20" text-anchor="middle">240 ps</text>
<text x="1052.5" y="87" font-size="20" text-anchor="middle">140 ps</text>
<text x="600" y="365" font-size="22" text-anchor="middle">Every stage register: +20 ps</text>
<text x="600" y="405" font-size="20" text-anchor="middle">Load value ready at MEM-end; ALU value ready at EX-end.</text>
