<text x="822.5" y="132" font-size="25" text-anchor="middle" font-weight="700">MEM</text>
<text x="822.5" y="160" font-size="17" text-anchor="middle">data memory</text>
<path class="line" d="M915,140 L960,140" marker-end="url(#arrow)"/>
<path class="line" d="M936,120 L936,160" stroke-width="5"/>
<rect x="960" y="100" width="185" height="80" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="WB"/>
<text x="1052.5" y="132" font-size="25" text-anchor="middle" font-weight="700">WB</text>
<text x="1052.5" y="160" font-size="17" text-anchor="middle">register write</text>
<path class="line" d="M706,140 L706,250 L590,250 L590,180" marker-end="url(#arrow)"/>
<text x="740" y="242" font-size="18" text-anchor="start">EX/MEM to EX</text>
