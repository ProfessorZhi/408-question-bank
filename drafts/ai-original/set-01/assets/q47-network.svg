<title id="title">Q47 fragment capture and unknown link MTU</title>
<desc id="desc">H sends two TCP segments through R to V. H-R MTU is 1500 B. R-V MTU is unknown M. Three observed IP packets are listed in arrival order; there is no fragment-completion or ACK answer in the diagram.</desc>
