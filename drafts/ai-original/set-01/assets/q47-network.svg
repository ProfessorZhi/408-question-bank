<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="555" viewBox="0 0 1160 555" role="img" aria-labelledby="title desc">
<title id="title">Q47 link-cost change with asynchronous routing-table updates</title>
<desc id="desc">Undirected topology R1-R2-R3-R4 with extra R1-R4 link; only R3-R4 link cost changes from 1 to 9, but stays operational. Network N is reached via R4.</desc>
