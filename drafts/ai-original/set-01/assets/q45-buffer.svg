<text x="140" y="223" font-size="24" text-anchor="middle" font-weight="700">Producer P</text>
<rect x="405" y="175" width="190" height="85" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="slot"/>
<text x="500" y="222" font-size="23" text-anchor="middle" font-weight="700">single slot</text>
<rect x="840" y="65" width="240" height="90" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="A"/>
<text x="960" y="117" font-size="23" text-anchor="middle" font-weight="700">Subscriber A</text>
