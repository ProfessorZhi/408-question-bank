<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="445" viewBox="0 0 1140 445" role="img" aria-labelledby="title desc">
<title id="title">Q45 three stages and two reusable slots</title>
<desc id="desc">A captures, B checks, C archives. A and C share device D. Two slots are reused only after archival. No semaphore solution appears.</desc>
