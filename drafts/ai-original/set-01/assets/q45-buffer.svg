<text x="960" y="317" font-size="23" text-anchor="middle" font-weight="700">Subscriber B</text>
<path class="line" d="M235,218 L405,218" marker-end="url(#arrow)"/>
<path class="line" d="M595,198 L840,110" marker-end="url(#arrow)"/>
