<text x="362.5" y="132" font-size="25" text-anchor="middle" font-weight="700">ID</text>
<text x="362.5" y="160" font-size="17" text-anchor="middle">register read</text>
<path class="line" d="M455,140 L500,140" marker-end="url(#arrow)"/>
<path class="line" d="M476,120 L476,160" stroke-width="5"/>
<rect x="500" y="100" width="185" height="80" rx="4" fill="white" stroke="#111" stroke-width="2.4" data-node="EX"/>
<text x="592.5" y="132" font-size="25" text-anchor="middle" font-weight="700">EX</text>
<text x="592.5" y="160" font-size="17" text-anchor="middle">ALU / branch</text>
<path class="line" d="M685,140 L730,140" marker-end="url(#arrow)"/>
